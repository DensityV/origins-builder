async function checkInvite() {
  if(!authUser) return null;
  const invite = await fbAuthRead(`users/${authUser.uid}/invite`, authUser.idToken);
  if(!invite) return null;
  // Clear invite after reading
  await fbAuthWrite(`users/${authUser.uid}/invite`, null, authUser.idToken);
  return invite;
}

async function fbWrite(path, data) {
  await fetch(`${FB_URL}/${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
}

async function fbRead(path) {
  const res = await fetch(`${FB_URL}/${path}.json`);
  return await res.json();
}

async function fbDelete(path) {
  await fetch(`${FB_URL}/${path}.json`, { method: 'DELETE' });
}

async function fbPoll(path, timeout=30000, interval=1000) {
  const start = Date.now();
  while(Date.now() - start < timeout) {
    const data = await fbRead(path);
    if(data !== null) return data;
    await new Promise(r => setTimeout(r, interval));
  }
  return null;
}

async function hostSessionFirebase(nsIds) {
  await fetchTURNCredentials();
  collab.shareNsIds = nsIds;

  const code = Math.random().toString(36).slice(2,8).toUpperCase();
  const pc = new RTCPeerConnection(RTC_CONFIG);
  const dc = pc.createDataChannel('origins', { ordered: true });

  collab.isHost = true;
  collab.active = true;
  collab.fbMode = true;
  collab.peers = [];
  collab.roomCode = code;
  collab.myColor = pickUniqueColor();
  collab._fbPc = pc;
  renderCollabUI();

  // Setup data channel
  setupPeerJSDataChannel(dc, pc);

  let _offerShown = false;
  const _sendOffer = async () => {
    if(_offerShown) return;
    _offerShown = true;
    const encoded = await encodeSignal(pc.localDescription);
    await fbWrite(`sessions/${code}/offer`, encoded);
    console.log('[FB] Offer written, room code:', code);

    // Poll for answer
    const answer = await fbPoll(`sessions/${code}/answer`);
    if(!answer) {
      alert('No one joined within 30 seconds.');
      fbDelete(`sessions/${code}`);
      endSession();
      return;
    }
    try {
      const sdp = await decodeSignal(answer);
      await pc.setRemoteDescription(sdp);
      await fbDelete(`sessions/${code}`);
      console.log('[FB] Answer received, connecting...');
    } catch(e) {
      alert('Connection failed: ' + e.message);
      endSession();
    }
  };

  pc.onicecandidate = e => { if(!e.candidate) _sendOffer(); };
  pc.onicegatheringstatechange = () => { if(pc.iceGatheringState === 'complete') _sendOffer(); };
  setTimeout(_sendOffer, 1500);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
}

async function joinSessionFirebase(code, nickname) {
  await fetchTURNCredentials();

  // Fetch offer from Firebase
  const offerEncoded = await fbRead(`sessions/${code}/offer`);
  if(!offerEncoded) {
    alert('Session not found. Check the room code and try again.');
    return;
  }

  const pc = new RTCPeerConnection(RTC_CONFIG);
  collab.isHost = false;
  collab.fbMode = true;
  collab.myNickname = nickname;

  pc.ondatachannel = e => {
    const dc = e.channel;
    setupJoinerDataChannel(dc, pc, nickname, code);
  };

  pc.oniceconnectionstatechange = () => {
    console.log('[FB JOIN] ICE:', pc.iceConnectionState);
    if(pc.iceConnectionState === 'failed') {
      alert('Connection failed. Try LAN mode instead.');
      endSession();
    }
  };

  let _answerSent = false;
  const _sendAnswer = async () => {
    if(_answerSent) return;
    _answerSent = true;
    const encoded = await encodeSignal(pc.localDescription);
    await fbWrite(`sessions/${code}/answer`, encoded);
    console.log('[FB] Answer written');
  };

  pc.onicecandidate = e => { if(!e.candidate) _sendAnswer(); };
  pc.onicegatheringstatechange = () => { if(pc.iceGatheringState === 'complete') _sendAnswer(); };
  setTimeout(_sendAnswer, 1500);

  const offer = await decodeSignal(offerEncoded);
  await pc.setRemoteDescription(offer);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
}

// Shared data channel setup for Firebase connections
function setupPeerJSDataChannel(dc, pc) {
  dc.onopen = () => {
    console.log('[FB] Host data channel open');
    collab._fbPc = pc;
    dc.send(JSON.stringify({ type: 'STATE_SYNC', state: getSharedState(),
      hostNickname: collab.myNickname, hostColor: collab.myColor }));
  };
  dc.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      if(data.type === 'PONG') { dc._lastPong = Date.now(); return; }
      if(data.type === 'PING') { try { dc.send(JSON.stringify({ type: 'PONG' })); } catch(e) {} return; }
      if(data.type === 'HELLO') {
        const color = pickUniqueColor();
        collab.peers.push({ nickname: data.nickname, connId: data.connId, color, dc });
        renderCollabUI();
        dc.send(JSON.stringify({ type: 'YOUR_COLOR', color }));
        dc.send(JSON.stringify({ type: 'STATE_SYNC', state: getSharedState(),
          hostNickname: collab.myNickname, hostColor: collab.myColor }));
      }
      handleFBMessage(data, true, dc);
    } catch(err) {}
  };
  dc.onclose = () => {
    collab.peers = collab.peers.filter(p => p.dc !== dc);
    renderCollabUI();
  };
}

function setupJoinerDataChannel(dc, pc, nickname, code) {
  dc.onopen = () => {
    collab.active = true;
    collab.roomCode = code.toUpperCase();
    const connId = 'fb-' + Math.random().toString(36).slice(2,8);
    dc.send(JSON.stringify({ type: 'HELLO', nickname, connId }));
    collab._fbDc = dc;
    collab._connectTimeout = setTimeout(() => {
      if(collab.active && !collab.isHost) {
        alert('Connection timed out. Try again.');
        endSession();
      }
    }, 15000);
    renderCollabUI();
  };
  dc.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      if(data.type === 'PING') { try { dc.send(JSON.stringify({ type: 'PONG' })); } catch(e) {} return; }
      if(data.type === 'PONG') return;
      handleFBMessage(data, false, dc);
    } catch(err) {}
  };
  dc.onclose = () => {
    if(collab.active) {
      collab.active = false;
      sessionState = null;
      state = localState;
      activeNs = localState.namespaces.length > 0 ? localState.namespaces[0].id : null;
      renderSidebar(); renderContent(); renderCollabUI();
    }
  };
}

function handleFBMessage(data, isHost, sourceDc) {
  if(data.type === 'YOUR_COLOR') { collab.myColor = data.color; }
  if(data.type === 'STATE_SYNC') {
    if(collab._connectTimeout) { clearTimeout(collab._connectTimeout); collab._connectTimeout = null; }
    applyRemoteState(data.state, false);
    if(!isHost && data.hostNickname && !collab.peers.find(p => p.isHost)) {
      collab.peers = collab.peers.filter(p => !p.isHost);
      collab.peers.unshift({ nickname: data.hostNickname, color: data.hostColor || '#7c5ce7',
        connId: 'host', isHost: true });
      renderCollabUI();
    }
  }
  if(data.type === 'STATE_PATCH') {
    if(isHost) {
      applyRemoteState(data.state, true);
      // Broadcast to other fb peers
      collab.peers.forEach(p => {
        if(p.dc && p.dc !== sourceDc && p.dc.readyState === 'open')
          p.dc.send(JSON.stringify({ type: 'STATE_PATCH', state: getSharedState() }));
      });
    } else {
      applyRemoteState(data.state, false);
    }
  }
  if(data.type === 'PEER_EDITOR_ACTION') {
    if(editingPower && data.powerId === editingPower.powerId) {
      const iframe = document.getElementById('editor-iframe');
      if(iframe && iframe.contentWindow) {
        sendPeerIdToEditor();
        iframe.contentWindow.postMessage({ type: 'PEER_ACTION', action: data.action, senderId: data.senderId }, '*');
      }
    }
    if(isHost) {
      collab.peers.forEach(p => {
        if(p.dc && p.dc !== sourceDc && p.dc.readyState === 'open')
          p.dc.send(JSON.stringify(data));
      });
    }
  }
  if(data.type === 'PEER_DRAG_MOVE' || data.type === 'PEER_DRAG_END') {
    if(editingPower && data.powerId === editingPower.powerId) {
      const iframe = document.getElementById('editor-iframe');
      if(iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
    }
    if(isHost) {
      collab.peers.forEach(p => {
        if(p.dc && p.dc !== sourceDc && p.dc.readyState === 'open')
          p.dc.send(JSON.stringify(data));
      });
    }
  }
  if(data.type === 'CHAT_MSG') {
    receiveChat(data);
    if(isHost) {
      collab.peers.forEach(p => {
        if(p.dc && p.dc !== sourceDc && p.dc.readyState === 'open')
          p.dc.send(JSON.stringify(data));
      });
    }
  }
  if(data.type === 'SESSION_ENDED') { endSession(); }
  if(data.type === 'KICKED') { endSession(); alert('You were kicked.'); }
}
function kickPeer(connId) {
  // Find peer dc in Firebase or LAN mode
  if(collab.fbMode) {
    const peer = collab.peers.find(p => p.connId === connId);
    if(peer && peer.dc && peer.dc.readyState === 'open') {
      try { peer.dc.send(JSON.stringify({ type: 'KICKED' })); } catch(e) {}
      try { peer.dc.close(); } catch(e) {}
    }
  } else if(collab.lanMode) {
    const dc = rtc.dcs[collab.peers.findIndex(p => p.connId === connId)];
    if(dc && dc.readyState === 'open') {
      try { dc.send(JSON.stringify({ type: 'KICKED' })); } catch(e) {}
    }
  }
  collab.peers = collab.peers.filter(p => p.connId !== connId);
  renderCollabUI();
}

function endSession() {
  if(collab._healthCheck) { clearInterval(collab._healthCheck); collab._healthCheck = null; }
  if(collab._hostHealthCheck) { clearInterval(collab._hostHealthCheck); collab._hostHealthCheck = null; }
  if(collab._connectTimeout) { clearTimeout(collab._connectTimeout); collab._connectTimeout = null; }
  if(collab.fbMode) {
    const farewell = JSON.stringify({ type: collab.isHost ? 'SESSION_ENDED' : 'PEER_LEAVE' });
    if(collab.isHost) {
      collab.peers.forEach(p => { if(p.dc && p.dc.readyState === 'open') try { p.dc.send(farewell); } catch(e) {} });
    } else if(collab._fbDc && collab._fbDc.readyState === 'open') {
      try { collab._fbDc.send(farewell); } catch(e) {}
    }
    if(collab._fbPc) { try { collab._fbPc.close(); } catch(e) {} collab._fbPc = null; }
    collab.fbMode = false; collab._fbDc = null;
  }
  if(collab.lanMode) { endSessionLAN(); collab.lanMode = false; collab.lanBaseUrl = null; collab.lanClientId = null; }
  const wasJoiner = collab.active && !collab.isHost;
  // Tell all peers we are leaving
  if(collab.isHost) {
    // Host tells all joiners session is ending
    collabBroadcast({ type: 'SESSION_ENDED' });
  } else {
    collabBroadcast({ type: 'PEER_LEAVE', connId: collab.peer?.id });
  }
  // Close all connections first, then destroy peer
  collab.conns.forEach(c => { try { c.close(); } catch(e) {} });
  if(collab.peer) {
    setTimeout(() => { try { collab.peer.destroy(); } catch(e) {} }, 200);
  }
  collab.peer = null;
  collab.conns = [];
  collab.peers = [];
  collab.active = false;
  collab.isHost = false;
  collab.roomCode = '';
  collab.showPanel = false;
  // Switch back to local state for joiner
  if(wasJoiner) {
    sessionState = null;
    state = localState;
    activeNs = localState.namespaces.length > 0 ? localState.namespaces[0].id : null;
    renderSidebar();
    renderContent();
  }
  renderCollabUI();
}

// Called whenever manager state changes — broadcast to peers
function saveAndSync() {
  if(collab.fbMode) {
    if(collab.isHost) {
      save();
      const msg = JSON.stringify({ type: 'STATE_PATCH', state: getSharedState() });
      collab.peers.forEach(p => {
        if(p.dc && p.dc.readyState === 'open') try { p.dc.send(msg); } catch(e) {}
      });
    } else {
      sendToHost({ type: 'STATE_PATCH', state: JSON.parse(JSON.stringify(sessionState || state)) });
    }
    return;
  }
  if(collab.lanMode) {
    if(collab.isHost) {
      save();
      lanBroadcast({ type: 'STATE_PATCH', state: getSharedState() });
    } else {
      sendToHost({ type: 'STATE_PATCH', state: JSON.parse(JSON.stringify(sessionState || state)) });
    }
    return;
  }
  save();
}

async function handleAuth(mode) {
  const email = document.getElementById('auth-email')?.value.trim();
  const password = document.getElementById('auth-password')?.value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  try {
    if(mode === 'signup') {
      const username = document.getElementById('auth-username')?.value.trim();
      if(!username) { errEl.textContent = 'Please enter a username'; errEl.style.display='block'; return; }
      await signUp(email, password, username);
    } else {
      await signIn(email, password);
    }
    const label = document.getElementById('account-btn-label');
    if(label) label.textContent = '👤 ' + authUser.username;
    renderAccountUI();
  } catch(e) {
    errEl.textContent = e.message.replace('_', ' ');
    errEl.style.display = 'block';
  }
}

async function handleSearchFriend() {
  const username = document.getElementById('friend-search')?.value.trim();
  const el = document.getElementById('friend-search-result');
  if(!username || !el) return;
  el.innerHTML = '<div style="font-size:12px;color:var(--muted)">Searching...</div>';
  const user = await searchUser(username);
  if(!user) {
    el.innerHTML = '<div style="font-size:12px;color:var(--muted)">User not found</div>';
    return;
  }
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;padding:10px;background:#0a0a16;border-radius:8px">
      <div style="font-size:13px;font-weight:600;flex:1">${user.username}</div>
      <button onclick="handleSendFriendRequest('${user.uid}')" style="background:var(--accent);border:none;color:#fff;
        border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer">Add Friend</button>
    </div>`;
}

async function handleSendFriendRequest(uid) {
  await sendFriendRequest(uid);
  document.getElementById('friend-search-result').innerHTML =
    '<div style="font-size:12px;color:#10b981">Friend request sent!</div>';
}

async function handleAcceptFriend(uid) {
  await acceptFriendRequest(uid);
  renderAccountUI();
}

async function handleDeclineFriend(uid) {
  await declineFriendRequest(uid);
  renderAccountUI();
}

async function handleRemoveFriend(uid) {
  if(confirm('Remove this friend?')) {
    await removeFriend(uid);
    renderAccountUI();
  }
}

async function handleInviteFriend(uid) {
  if(!collab.active || !collab.roomCode) return;
  await sendInvite(uid, collab.roomCode);
  alert('Invite sent!');
}

function handleHost() {
  let nick = document.getElementById('cp-host-nick')?.value.trim();
  if(!nick && authUser) nick = authUser.username;
  if(!nick) { alert('Please enter a nickname'); return; }
  const checked = localState.namespaces
    .filter(n => document.getElementById('cp-ns-'+n.id)?.checked)
    .map(n => n.id);
  if(checked.length === 0) { alert('Please select at least one namespace to share'); return; }
  collab.myNickname = nick;
  hostSessionFirebase(checked);
  toggleCollabPanel();
}

function handleHostLAN() {
  const nick = document.getElementById('cp-host-nick')?.value.trim();
  if(!nick) { alert('Please enter a nickname'); return; }
  const checked = localState.namespaces
    .filter(n => document.getElementById('cp-ns-'+n.id)?.checked)
    .map(n => n.id);
  if(checked.length === 0) { alert('Please select at least one namespace to share'); return; }
  collab.myNickname = nick;
  hostSessionLAN(checked);
  toggleCollabPanel();
}

function handleJoin() {
  const nick = document.getElementById('cp-nick')?.value.trim();
  const code = document.getElementById('cp-code')?.value.trim();
  if(!nick) { alert('Please enter a nickname'); return; }
  if(!code || code.length < 4) { alert('Please enter a valid room code'); return; }
  joinSessionFirebase(code, nick);
  toggleCollabPanel();
}

function sendChat(text) {
  if(!text.trim() || !collab.active) return;
  const msg = {
    type: 'CHAT_MSG',
    nickname: collab.myNickname || 'Unknown',
    text: text.trim(),
    timestamp: Date.now(),
    color: collab.myColor || '#7c5ce7'
  };
  // Add to own chat
  chatMessages.push(msg);
  renderChat();
  // Broadcast to peers
  if(collab.lanMode) {
    if(collab.isHost) lanBroadcast(msg);
    else lanSend(msg, null, 'host');
  } else if(collab.isHost) {
    collabBroadcast(msg);
  } else {
    sendToHost(msg);
  }
}

function receiveChat(msg) {
  chatMessages.push(msg);
  if(!chatOpen) {
    chatUnread++;
    updateChatBadge();
  }
  renderChat();
  // Forward to editor iframe
  const iframe = document.getElementById('editor-iframe');
  if(iframe && iframe.contentWindow) {
    try { iframe.contentWindow.postMessage({ type: 'CHAT_BADGE', unread: chatUnread }, '*'); } catch(e) {}
  }
}

function renderChat() {
  const el = document.getElementById('chat-messages');
  if(!el) return;
  el.innerHTML = chatMessages.map(m => {
    const time = new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return `<div style="margin-bottom:10px">
      <span style="font-size:11px;font-weight:700;color:${m.color}">${m.nickname}</span>
      <span style="font-size:10px;color:#444;margin-left:6px">${time}</span>
      <div style="font-size:13px;color:#e0e0f0;margin-top:2px;word-break:break-word">${m.text}</div>
    </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function updateChatBadge() {
  const badge = document.getElementById('chat-badge');
  if(badge) {
    badge.style.display = chatUnread > 0 ? 'flex' : 'none';
    badge.textContent = chatUnread > 9 ? '9+' : chatUnread;
  }
  // Tell editor about unread count
  const iframe = document.getElementById('editor-iframe');
  if(iframe && iframe.contentWindow) {
    try { iframe.contentWindow.postMessage({ type: 'CHAT_BADGE', unread: chatUnread }, '*'); } catch(e) {}
  }
}

function toggleChat() {
  chatOpen = !chatOpen;
  const panel = document.getElementById('chat-panel');
  if(panel) panel.style.display = chatOpen ? 'flex' : 'none';
  if(chatOpen) {
    chatUnread = 0;
    updateChatBadge();
    renderChat();
    setTimeout(() => document.getElementById('chat-input')?.focus(), 50);
  }
}

function updateSetting(key, val) {
  collab.settings[key] = val;
  const msg = { type: 'SETTINGS_UPDATE', settings: collab.settings };
  if(collab.lanMode) lanBroadcast(msg);
  else collabBroadcast(msg);
  renderCollabUI();
}

// ── Apply settings to CSS vars ────────────────────────────────────────────
function applyManagerSettings(){
  const ms = (() => { try { return JSON.parse(localStorage.getItem('origins-editor-settings') || '{}'); } catch(e) { return {}; } })();
  const root = document.documentElement;
  root.style.setProperty('--bg', ms.managerBg || '#0a0a16');
  root.style.setProperty('--panel', ms.managerPanel || '#0f0f20');
  root.style.setProperty('--accent', ms.managerAccent || '#7c5ce7');
  root.style.setProperty('--accent2', ms.managerAccent2 || '#00d2d3');
  document.body.style.fontFamily = ms.font || "'Sora',sans-serif";
}
applyManagerSettings();

// ── Init ──────────────────────────────────────────────────────────────────
renderSidebar();
if (localState.namespaces.length > 0) selectNs(localState.namespaces[0].id);

// Auto sign in
autoSignIn().then(signedIn => {
  if(signedIn) {
    const label = document.getElementById('account-btn-label');
    if(label) label.textContent = '👤 ' + authUser.username;
    // Check for pending invites
    checkInvite().then(invite => {
      if(invite && Date.now() - invite.timestamp < 300000) { // 5 min window
        if(confirm(`${invite.username} invited you to a session. Join now?`)) {
          toggleCollabPanel();
          collab._panelMode = 'join';
          renderCollabUI();
          setTimeout(() => {
            const codeEl = document.getElementById('cp-code');
            const nickEl = document.getElementById('cp-nick');
            if(codeEl) codeEl.value = invite.roomCode;
            if(nickEl) nickEl.value = authUser.username;
          }, 100);
        }
      }
    });
  }
});
</script>
</body>
</html>
