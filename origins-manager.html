<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origins File Manager</title>
<!-- BUILD: 2026-05-11-LAN-v3 -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap');

  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0a0a16;
    --panel:#0f0f20;
    --surface:#161628;
    --surface2:#1e1e36;
    --border:#ffffff0d;
    --border2:#ffffff18;
    --accent:#7c5ce7;
    --accent2:#00d2d3;
    --accent3:#fd79a8;
    --text:#f0f0f8;
    --muted:#7878a8;
    --danger:#ff6b6b;
    --success:#00d2a0;
    --warning:#ffd32a;
    --font:'Sora',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* Ambient background + dot grid texture */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(124,92,231,0.1) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0,210,211,0.07) 0%, transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.07) 1.5px,transparent 1.5px);
    background-size:28px 28px;
    pointer-events:none;
    z-index:0;
  }

  /* ── Header ── */
  header{
    position:relative;z-index:10;
    background:var(--panel);
    border-bottom:1px solid var(--border2);
    padding:0 24px;
    height:56px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-shrink:0;
    backdrop-filter:blur(20px);
  }
  header::after{
    content:'';
    position:absolute;
    bottom:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent)66,transparent);
  }
  .logo{
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.12em;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .logo span{color:var(--accent2);}
  header h1{
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .header-actions{margin-left:auto;display:flex;gap:8px;}

  /* ── Buttons ── */
  .btn{
    font-family:var(--font);
    font-size:11px;
    font-weight:600;
    padding:7px 16px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    transition:all 0.15s;
    display:flex;
    align-items:center;
    gap:6px;
    letter-spacing:0.02em;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#6c4fd4);
    color:#fff;
    box-shadow:0 4px 15px rgba(124,92,231,0.3);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,92,231,0.4);}
  .btn-secondary{
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--border2);
  }
  .btn-secondary:hover{border-color:var(--accent)66;color:var(--accent);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)33;}
  .btn-danger:hover{background:var(--danger)15;border-color:var(--danger)66;}
  .btn-success{background:linear-gradient(135deg,var(--success),#00b894);color:#fff;}
  .btn-success:hover{transform:translateY(-1px);}
  .btn-sm{padding:4px 10px;font-size:10px;border-radius:6px;}
  .btn-xs{padding:3px 8px;font-size:10px;border-radius:5px;}

  /* ── Layout ── */
  .main{display:flex;flex:1;overflow:hidden;position:relative;z-index:1;}

  /* ── Sidebar ── */
  .sidebar{
    width:260px;
    background:var(--panel);
    border-right:1px solid var(--border2);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    overflow:hidden;
    position:relative;
    z-index:1;
  }
  .sidebar-header{
    padding:16px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-title{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .ns-list{padding:8px;flex:1;overflow-y:auto;}
  .ns-item{
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    font-weight:500;
    transition:all 0.12s;
    margin-bottom:2px;
    border:1px solid transparent;
  }
  .ns-item:hover{background:var(--surface2);border-color:var(--border2);}
  .ns-item.active{
    background:linear-gradient(135deg,var(--accent)15,var(--accent)08);
    border-color:var(--accent)44;
    color:var(--text);
  }
  .ns-dot{
    width:8px;height:8px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow:0 0 6px currentColor;
  }
  .ns-count{
    margin-left:auto;
    font-size:10px;
    font-family:var(--mono);
    color:var(--text);
    background:var(--surface2);
    border:1px solid var(--border2);
    padding:2px 7px;
    border-radius:5px;
    font-weight:600;
  }
  .sidebar-empty{
    padding:24px 16px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
  }
  .sidebar-empty-icon{font-size:28px;margin-bottom:8px;opacity:0.7;}

  /* ── Content ── */
  .content{
    flex:1;
    overflow-y:auto;
    padding:28px;
    background:transparent;
  }
  .content-empty{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    height:100%;gap:16px;color:var(--muted);
  }
  .content-empty-icon{font-size:56px;opacity:0.5;}
  .content-empty p{font-size:14px;font-weight:500;}
  .content-empty small{font-size:12px;opacity:0.7;}

  /* ── Namespace header ── */
  .ns-header{
    display:flex;align-items:center;gap:12px;
    margin-bottom:24px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
  }
  .ns-header h2{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  .ns-badge{
    font-family:var(--mono);
    font-size:11px;
    background:var(--accent)18;
    color:var(--accent);
    padding:4px 10px;
    border-radius:6px;
    border:1px solid var(--accent)33;
    letter-spacing:0.05em;
  }

  /* ── Tabs ── */
  .tabs{
    display:flex;gap:2px;
    background:var(--panel);
    border-radius:12px;
    padding:4px;
    margin-bottom:24px;
    width:fit-content;
    border:1px solid var(--border2);
  }
  .tab{
    padding:7px 18px;
    border-radius:9px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:all 0.15s;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .tab.active{
    background:var(--surface2);
    color:var(--text);
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
  .tab:hover:not(.active){color:var(--text);}

  /* ── Origin cards ── */
  .origins-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
  }
  .origin-card{
    background:linear-gradient(135deg,var(--panel),var(--surface));
    border:1px solid var(--border2);
    border-radius:14px;
    padding:18px;
    transition:all 0.2s;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
  }
  .origin-card::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,var(--accent)05,transparent);
    opacity:0;
    transition:opacity 0.2s;
  }
  .origin-card:hover{border-color:var(--accent)44;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
  .origin-card:hover::before{opacity:1;}
  .origin-card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
  .origin-icon{
    font-size:22px;
    width:44px;height:44px;
    background:var(--surface2);
    border:1px solid var(--border2);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .origin-name{font-size:14px;font-weight:700;margin-bottom:3px;letter-spacing:-0.01em;}
  .origin-desc{font-size:11px;color:var(--muted);line-height:1.5;}
  .origin-powers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
  .power-tag{
    font-size:10px;
    font-family:var(--mono);
    background:var(--surface2);
    border:1px solid var(--border2);
    border-radius:4px;
    padding:2px 6px;
    color:var(--muted);
  }
  .origin-card-actions{
    display:flex;gap:6px;
    padding-top:12px;
    border-top:1px solid var(--border);
  }

  /* ── Powers list ── */
  .powers-list{display:flex;flex-direction:column;gap:8px;}
  .power-row{
    background:linear-gradient(135deg,var(--panel),var(--surface));
    border:1px solid var(--border2);
    border-radius:12px;
    padding:14px 16px;
    display:flex;align-items:center;gap:12px;
    transition:all 0.15s;
    cursor:pointer;
    box-shadow:0 2px 12px rgba(0,0,0,0.15);
  }
  .power-row:hover{border-color:var(--accent)44;background:var(--surface);}
  .power-row.selected{border-color:var(--accent);background:var(--accent)0d;}
  .power-status{
    width:8px;height:8px;
    border-radius:50%;flex-shrink:0;
  }
  .power-status.saved{background:var(--success);box-shadow:0 0 6px var(--success)88;}
  .power-status.unsaved{background:var(--warning);box-shadow:0 0 6px var(--warning)66;}
  .power-name{font-size:13px;font-weight:600;flex:1;letter-spacing:-0.01em;}
  .power-id{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
  .power-type-badge{
    font-size:9px;
    font-family:var(--mono);
    background:var(--surface2);
    border:1px solid var(--border2);
    border-radius:4px;
    padding:3px 7px;
    color:var(--muted);
    flex-shrink:0;
    letter-spacing:0.03em;
  }
  .power-actions{display:flex;gap:5px;flex-shrink:0;}

  /* ── Add card ── */
  .add-card{
    background:transparent;
    border:1.5px dashed var(--border2);
    border-radius:14px;
    padding:28px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:8px;cursor:pointer;
    transition:all 0.2s;
    color:var(--muted);
  }
  .add-card:hover{
    border-color:var(--accent)66;
    color:var(--accent);
    background:var(--accent)06;
  }
  .add-card-icon{font-size:22px;}
  .add-card-label{font-size:12px;font-weight:600;letter-spacing:0.02em;}

  /* ── Layer rows ── */
  .layer-row{
    background:var(--panel);
    border:1px solid var(--border2);
    border-radius:12px;
    padding:14px 16px;
    display:flex;align-items:center;gap:12px;
    transition:all 0.15s;cursor:pointer;
  }
  .layer-row:hover{border-color:var(--accent2)44;background:var(--surface);}
  .layer-dot{
    width:10px;height:10px;
    border-radius:3px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    flex-shrink:0;
  }

  /* ── Modal ── */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(6px);
    z-index:1000;
    display:flex;align-items:center;justify-content:center;
  }
  .modal{
    background:var(--panel);
    border:1px solid var(--border2);
    border-radius:18px;
    padding:28px;
    width:460px;
    max-width:90vw;
    box-shadow:0 24px 64px rgba(0,0,0,0.5);
  }
  .modal h3{
    font-size:16px;
    font-weight:700;
    margin-bottom:20px;
    letter-spacing:-0.02em;
  }
  .form-group{margin-bottom:16px;}
  .form-group label{
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
    display:block;
    margin-bottom:7px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select{
    width:100%;
    background:var(--surface2);
    border:1.5px solid var(--border2);
    border-radius:10px;
    padding:9px 13px;
    font-size:13px;
    color:var(--text);
    font-family:var(--font);
    outline:none;
    transition:border-color 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus{border-color:var(--accent);}
  .form-group textarea{resize:vertical;min-height:72px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;}

  /* ── Editor overlay ── */
  .editor-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;}
  .editor-toolbar{
    background:var(--panel);
    border-bottom:1px solid var(--border2);
    padding:10px 20px;
    display:flex;align-items:center;gap:14px;
    flex-shrink:0;
  }
  .editor-toolbar .power-info{flex:1;}
  .editor-toolbar .power-info strong{font-size:13px;font-weight:700;}
  .editor-toolbar .power-info span{
    font-size:10px;
    color:var(--muted);
    margin-left:10px;
    font-family:var(--mono);
  }
  .editor-iframe{flex:1;border:none;width:100%;}

  /* ── Power selector ── */
  .power-selector{
    display:flex;flex-direction:column;gap:5px;
    max-height:200px;overflow-y:auto;
    background:var(--surface2);
    border-radius:10px;
    padding:8px;
    border:1.5px solid var(--border2);
  }
  .power-select-item{
    display:flex;align-items:center;gap:10px;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;transition:background 0.1s;
  }
  .power-select-item:hover{background:var(--surface);}
  .power-select-item input[type=checkbox]{accent-color:var(--accent);}

  /* ── Section heading ── */
  .section-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .section-bar h3{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar{width:4px;height:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);}

  .hidden{display:none!important;}
</style>

  <!-- Firebase SDK for Google Auth -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut as fbSignOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCsqg5hN06xOYUEQzQEIL2-NWPjEOZ2JZk",
      authDomain: "originsbuilder-e1491.firebaseapp.com",
      projectId: "originsbuilder-e1491",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window._googleSignIn = async function() {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const idToken = await user.getIdToken();
        // Pass to our auth system
        window._handleGoogleSignIn(user.uid, user.email, user.displayName, idToken);
      } catch(e) {
        console.error('Google sign in error:', e);
        alert('Google sign in failed: ' + e.message);
      }
    };

    window._googleSignOut = async function() {
      try { await fbSignOut(auth); } catch(e) {}
    };
  </script>
</head>
<body>

<header>
  <div class="logo">ORIGINS <span>MANAGER</span></div>
  <h1>File Structure Builder</h1>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="exportZip()">⬇ Export ZIP</button>
    <button class="btn btn-secondary" id="account-btn" onclick="toggleAccountPanel()" style="position:relative">
      <span id="account-btn-label">👤 Account</span>
    </button>
    <button class="btn btn-secondary" id="share-btn" onclick="toggleCollabPanel()" style="position:relative">
      <span id="share-btn-label">Share</span>
      <span id="share-indicator" style="display:none;width:8px;height:8px;background:#10b981;border-radius:50%;margin-left:4px;box-shadow:0 0 6px #10b981"></span>
    </button>
    <button class="btn btn-secondary" onclick="openOverlay('guide')">? Guide</button>
    <button class="btn btn-secondary" onclick="openOverlay('settings')">⚙ Settings</button>
    <button class="btn btn-primary" onclick="showNewNsModal()">+ Namespace</button>
  </div>
</header>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Namespaces</span>
      <span class="ns-count" id="ns-count">0</span>
    </div>
    <div class="ns-list" id="ns-list"></div>
    <div id="ns-empty" class="sidebar-empty"><div class="sidebar-empty-icon">📦</div>No namespaces yet.<br>Create one to get started.</div>
  </div>

  <!-- Content -->
  <div class="content" id="content">
    <div class="content-empty">
      <div class="content-empty-icon">📁</div>
      <p>Select a namespace</p>
      <small>or create one using the button above</small>
    </div>
  </div>
</div>

<!-- Editor overlay -->
<!-- Guide Overlay -->
<div class="editor-overlay hidden" id="guide-overlay">
  <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,0.08);">
    <button onclick="document.getElementById('guide-overlay').classList.add('hidden')" 
      style="background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;font-weight:600;font-family:'Sora',sans-serif">✕ Close Guide</button>
  </div>
  <iframe class="editor-iframe" id="guide-iframe" src=""></iframe>
</div>

<!-- Settings Overlay -->
<div class="editor-overlay hidden" id="settings-overlay">
  <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,0.08);">
    <button onclick="document.getElementById('settings-overlay').classList.add('hidden')" 
      style="background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;font-weight:600;font-family:'Sora',sans-serif">✕ Close Settings</button>
  </div>
  <iframe class="editor-iframe" id="settings-iframe" src=""></iframe>
</div>

<div class="editor-overlay hidden" id="editor-overlay">
  <div class="editor-toolbar">
    <div class="power-info">
      <strong id="editor-power-name">Power</strong>
      <span id="editor-power-id"></span>
    </div>
    <button class="btn btn-success" onclick="savePowerFromEditor()">💾 Save Power</button>
    <button class="btn btn-secondary" onclick="closeEditor()">✕ Close Editor</button>
  </div>
  <iframe class="editor-iframe" id="editor-iframe" src="origins-editor.html"></iframe>
</div>

<!-- Chat Panel -->
<div id="chat-panel" style="display:none;position:fixed;bottom:80px;right:20px;width:300px;height:380px;
  background:#0f0f20;border:1px solid rgba(255,255,255,0.1);border-radius:16px;
  z-index:1000;box-shadow:0 16px 48px rgba(0,0,0,0.6);flex-direction:column;
  font-family:'Sora',sans-serif;overflow:hidden;">
  <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;">
    <div style="font-size:13px;font-weight:700;color:#fff">Chat</div>
    <button onclick="toggleChat()" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px;line-height:1">✕</button>
  </div>
  <div id="chat-messages" style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px;"></div>
  <div style="padding:10px;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:8px;">
    <input id="chat-input" placeholder="Message..." maxlength="500"
      style="flex:1;background:#0a0a16;border:1px solid rgba(124,92,231,0.3);border-radius:8px;
      padding:8px 12px;font-size:12px;color:#fff;outline:none;font-family:'Sora',sans-serif"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){sendChat(this.value);this.value='';event.preventDefault();}"/>
    <button onclick="const i=document.getElementById('chat-input');sendChat(i.value);i.value='';"
      style="background:var(--accent);border:none;color:#fff;border-radius:8px;padding:8px 12px;
      font-size:12px;font-weight:600;cursor:pointer;font-family:'Sora',sans-serif">Send</button>
  </div>
</div>

<!-- Chat Button -->
<div id="chat-btn" style="display:none;position:fixed;bottom:20px;right:20px;z-index:999;">
  <button onclick="toggleChat()" style="width:48px;height:48px;border-radius:50%;background:var(--accent);
    border:none;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(124,92,231,0.4);
    position:relative;display:flex;align-items:center;justify-content:center;">
    💬
    <span id="chat-badge" style="display:none;position:absolute;top:-4px;right:-4px;
      background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;
      font-size:10px;font-weight:700;align-items:center;justify-content:center;
      font-family:'Sora',sans-serif;">0</span>
  </button>
</div>

<!-- Account Panel -->
<div id="account-panel" style="display:none;position:fixed;top:64px;right:20px;width:320px;
  background:#0f0f20;border:1px solid rgba(255,255,255,0.1);border-radius:16px;
  z-index:900;box-shadow:0 16px 48px rgba(0,0,0,0.6);padding:20px;
  font-family:'Sora',sans-serif;max-height:80vh;overflow-y:auto;">
  <div id="account-panel-content"></div>
</div>

<!-- Collab Panel -->
<div id="collab-panel" style="display:none;position:fixed;top:64px;right:20px;width:310px;
  background:#0f0f20;border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:20px;
  z-index:900;box-shadow:0 16px 48px rgba(0,0,0,0.6);font-family:'Sora',sans-serif;color:#f0f0f8;">
</div>

<!-- Modals -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
// ── Load shared settings ─────────────────────────────────────────────────
const MS = (() => {
  try { return JSON.parse(localStorage.getItem('origins-editor-settings') || '{}'); } catch(e) { return {}; }
})();
const MUI = {
  bg:      MS.managerBg      || '#0a0a16',
  panel:   MS.managerPanel   || '#0f0f20',
  accent:  MS.managerAccent  || '#7c5ce7',
  accent2: MS.managerAccent2 || '#00d2d3',
  font:    MS.font           || "'Sora',sans-serif",
};

let localState = JSON.parse(JSON.stringify(JSON.parse(localStorage.getItem('origins-manager') || '{"namespaces":[]}')));
let sessionState = null; // host's state when connected as joiner
// state always points to whichever is active
let state = localState;
let activeNs = null;
let activeTab = 'origins';
let editingPower = null; // {nsId, powerId}

function sendPeerIdToEditor() {
  const peerId = collab.lanMode ? collab.lanClientId : collab.peer?.id;
  if(peerId) {
    const iframe = document.getElementById('editor-iframe');
    if(iframe && iframe.contentWindow) {
      try { iframe.contentWindow.postMessage({ type: 'SET_PEER_ID', peerId }, '*'); } catch(e) {}
    }
  }
}

function save() {
  // Always save LOCAL state — deep clone to ensure no session references bleed in
  localStorage.setItem('origins-manager', JSON.stringify(JSON.parse(JSON.stringify(localState))));
}

function getNs(id) { return state.namespaces.find(n => n.id === id); }

function genId(name) {
  return name.toLowerCase().replace(/[^a-z0-9_]/g, '_').replace(/__+/g, '_').replace(/^_|_$/g, '') || 'item_' + Date.now();
}

// ── Render sidebar ────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('ns-list');
  const empty = document.getElementById('ns-empty');
  document.getElementById('ns-count').textContent = state.namespaces.length;
  if (state.namespaces.length === 0) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = state.namespaces.map(ns => `
    <div class="ns-item${activeNs === ns.id ? ' active' : ''}" onclick="selectNs('${ns.id}')">
      <div class="ns-dot" style="background:${ns.color||'#7c5ce7'}"></div>
      <span>${ns.name}</span>
      <span style="margin-left:auto;font-size:10px;color:var(--muted)">${(ns.powers||[]).length}p</span>
    </div>
  `).join('');
}

// ── Select namespace ──────────────────────────────────────────────────────
function selectNs(id) {
  activeNs = id;
  activeTab = 'origins';
  renderSidebar();
  renderContent();
}

// ── Render content ────────────────────────────────────────────────────────
function renderContent() {
  const ns = getNs(activeNs);
  const content = document.getElementById('content');
  if (!ns) {
    content.innerHTML = `<div class="content-empty"><div class="content-empty-icon">📁</div><p>Select a namespace</p><small>or create one using the button above</small></div>`;
    return;
  }

  const originsTab = activeTab === 'origins';
  const powersTab = activeTab === 'powers';

  const originsHtml = originsTab ? renderOriginsTab(ns) : '';
  const powersHtml = powersTab ? renderPowersTab(ns) : '';

  content.innerHTML = `
    <div class="ns-header">
      <h2>${ns.name}</h2>
      <div class="ns-badge">${ns.id}</div>
      <button class="btn btn-danger btn-sm" onclick="deleteNs('${ns.id}')">Delete</button>
    </div>
    <div class="tabs">
      <div class="tab${originsTab?' active':''}" onclick="setTab('origins')">Origins (${(ns.origins||[]).length})</div>
      <div class="tab${powersTab?' active':''}" onclick="setTab('powers')">Powers (${(ns.powers||[]).length})</div>
      <div class="tab${activeTab==='layers'?' active':''}" onclick="setTab('layers')">Layers (${(ns.layers||[]).length})</div>
    </div>
    ${originsHtml}
    ${powersHtml}
    ${activeTab==='layers'?renderLayersTab(ns):''}
  `;
}

function setTab(tab) {
  activeTab = tab;
  renderContent();
}

function renderLayersTab(ns) {
  const layers = ns.layers || [];
  const rows = layers.map(l => `
    <div class="layer-row" data-item-id="layer-${ns.id}-${l.id}" onclick="selectItem('layer','${ns.id}','${l.id}')">
      <div>
        <div class="power-name">${l.name}</div>
        <div class="power-id">data/origins/origin_layers/${l.id}.json &nbsp;·&nbsp; order: ${l.order ?? 1} &nbsp;·&nbsp; replace: ${l.replace ? 'true' : 'false'}</div>
      </div>
      <div class="power-actions">
        <button class="btn btn-secondary btn-sm" onclick="editLayer('${ns.id}','${l.id}')">✏ Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteLayer('${ns.id}','${l.id}')">✕</button>
      </div>
    </div>
  `).join('');

  return `
    <div class="powers-list">
      ${rows}
      <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="showNewLayerModal('${ns.id}')">+ New Layer</button>
    </div>
  `;
}

function renderOriginsTab(ns) {
  const origins = ns.origins || [];
  const cards = origins.map(o => {
    const powerTags = (o.powers || []).map(pid => {
      const p = (ns.powers || []).find(p => p.id === pid);
      return p ? `<span class="power-tag">${p.id}</span>` : '';
    }).join('');
    return `
      <div class="origin-card" data-item-id="origin-${ns.id}-${o.id}" onclick="selectItem('origin','${ns.id}','${o.id}')">
        <div class="origin-card-header">
          <div class="origin-icon">${o.icon || '⭐'}</div>
          <div>
            <div class="origin-name">${o.name}</div>
            <div class="origin-desc">${o.description || 'No description'}</div>
          </div>
        </div>
        ${powerTags ? `<div class="origin-powers">${powerTags}</div>` : ''}
        <div class="origin-card-actions">
          <button class="btn btn-secondary btn-sm" onclick="renameOrigin('${ns.id}','${o.id}')">✎</button>
          <button class="btn btn-secondary btn-sm" onclick="editOrigin('${ns.id}','${o.id}')">✏ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteOrigin('${ns.id}','${o.id}')">✕</button>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="origins-grid">
      ${cards}
      <div class="add-card" onclick="showNewOriginModal('${ns.id}')">
        <div class="add-card-icon">+</div>
        <div class="add-card-label">New Origin</div>
      </div>
    </div>
  `;
}

function renderPowersTab(ns) {
  const powers = ns.powers || [];
  const rows = powers.map(p => `
    <div class="power-row" data-item-id="power-${ns.id}-${p.id}" onclick="selectItem('power','${ns.id}','${p.id}')" style="cursor:pointer">
      <div class="power-status ${p.json ? 'saved' : 'unsaved'}" title="${p.json ? 'Has saved JSON' : 'No JSON yet'}"></div>
      <div>
        <div class="power-name">${p.name}</div>
        <div class="power-id">${ns.id}:${p.subfolder?p.subfolder+'/':''}${p.id}</div>
      </div>
      ${p.type ? `<div class="power-type-badge">${p.type}</div>` : ''}
      <div class="power-actions">
        <button class="btn btn-secondary btn-sm" onclick="renamePower('${ns.id}','${p.id}')">✎</button>
        <button class="btn btn-secondary btn-sm" onclick="openEditor('${ns.id}','${p.id}')">✏ Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deletePower('${ns.id}','${p.id}')">✕</button>
      </div>
    </div>
  `).join('');

  return `
    <div class="powers-list">
      ${rows}
      <button class="btn btn-secondary" style="width:100%;justify-content:center" onclick="showNewPowerModal('${ns.id}')">+ New Power</button>
    </div>
  `;
}

// ── Modals ────────────────────────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-backdrop').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
}
document.getElementById('modal-backdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-backdrop')) closeModal();
});

function showNewNsModal() {
  showModal(`
    <h3>New Namespace</h3>
    <div class="form-group">
      <label>Namespace ID</label>
      <input id="ns-id-input" placeholder="e.g. chaos" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')">
    </div>
    <div class="form-group">
      <label>Display Name</label>
      <input id="ns-name-input" placeholder="e.g. Chaos Origins">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createNs()">Create</button>
    </div>
  `);
  setTimeout(() => document.getElementById('ns-id-input').focus(), 50);
}

function createNs() {
  const id = document.getElementById('ns-id-input').value.trim();
  const name = document.getElementById('ns-name-input').value.trim();
  if (!id || !name) return;
  if (state.namespaces.find(n => n.id === id)) { alert('Namespace ID already exists'); return; }
  state.namespaces.push({ id, name, origins: [], powers: [], layers: [], color: '#7c5ce7' });
  saveAndSync();
  closeModal();
  selectNs(id);
}

function showNewOriginModal(nsId) {
  const ns = getNs(nsId);
  const powers = (ns.powers || []).map(p => `
    <div class="power-select-item">
      <input type="checkbox" id="op-${p.id}" value="${p.id}">
      <label for="op-${p.id}" style="cursor:pointer;flex:1">
        <div style="font-size:12px;font-weight:600">${p.name}</div>
        <div style="font-size:10px;color:var(--muted);font-family:monospace">${nsId}:${p.id}</div>
      </label>
    </div>
  `).join('');

  showModal(`
    <h3>New Origin</h3>
    <div class="form-group">
      <label>Name</label>
      <input id="o-name" placeholder="e.g. Angel">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="o-desc" placeholder="Origin description..."></textarea>
    </div>
    <div class="form-group">
      <label>Icon (emoji, for display)</label>
      <input id="o-icon" placeholder="⭐" style="width:80px">
    </div>
    <div class="form-group">
      <label>Icon Item (Minecraft item ID)</label>
      <input id="o-icon-item" placeholder="minecraft:paper">
    </div>
    <div style="display:flex;gap:12px">
      <div class="form-group" style="flex:1">
        <label>Impact (0-3)</label>
        <select id="o-impact">
          <option value="0">0 — None</option>
          <option value="1">1 — Low</option>
          <option value="2">2 — Medium</option>
          <option value="3">3 — High</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>Order (optional)</label>
        <input id="o-order" placeholder="e.g. 1" type="number">
      </div>
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="o-unchoosable"> Unchoosable
      </label>
    </div>
    <div class="form-group">
      <label>Assign Powers</label>
      <div class="power-selector">${powers || '<div style="color:var(--muted);font-size:12px;padding:8px">No powers yet — create powers first</div>'}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createOrigin('${nsId}')">Create</button>
    </div>
  `);
}

function createOrigin(nsId) {
  if(!collab.isHost && collab.active && !collab.settings.allowCreate) { alert("The host has not enabled this action."); return; }
  const name = document.getElementById('o-name').value.trim();
  const desc = document.getElementById('o-desc').value.trim();
  const icon = document.getElementById('o-icon').value.trim() || '⭐';
  const iconItem = document.getElementById('o-icon-item')?.value.trim() || 'minecraft:paper';
  const impact = parseInt(document.getElementById('o-impact')?.value || '0');
  const order = document.getElementById('o-order')?.value.trim();
  const unchoosable = document.getElementById('o-unchoosable')?.checked || false;
  if (!name) return;
  const powers = [...document.querySelectorAll('.power-select-item input:checked')].map(c => c.value);
  const ns = getNs(nsId);
  const id = genId(name);
  ns.origins = ns.origins || [];
  ns.origins.push({ id, name, description: desc, icon, iconItem, impact, order: order||undefined, unchoosable, powers });
  saveAndSync();
  closeModal();
  renderContent();
}

function editOrigin(nsId, originId) {
  const ns = getNs(nsId);
  const o = ns.origins.find(o => o.id === originId);
  if (!o) return;

  const powers = (ns.powers || []).map(p => `
    <div class="power-select-item">
      <input type="checkbox" id="op-${p.id}" value="${p.id}" ${(o.powers||[]).includes(p.id)?'checked':''}>
      <label for="op-${p.id}" style="cursor:pointer;flex:1">
        <div style="font-size:12px;font-weight:600">${p.name}</div>
        <div style="font-size:10px;color:var(--muted);font-family:monospace">${nsId}:${p.id}</div>
      </label>
    </div>
  `).join('');

  showModal(`
    <h3>Edit Origin: ${o.name}</h3>
    <div class="form-group">
      <label>Name</label>
      <input id="o-name" value="${o.name}">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="o-desc">${o.description||''}</textarea>
    </div>
    <div class="form-group">
      <label>Icon (emoji)</label>
      <input id="o-icon" value="${o.icon||'⭐'}" style="width:80px">
    </div>
    <div class="form-group">
      <label>Icon Item</label>
      <input id="o-icon-item" value="${o.iconItem||'minecraft:paper'}">
    </div>
    <div style="display:flex;gap:12px">
      <div class="form-group" style="flex:1">
        <label>Impact (0-3)</label>
        <select id="o-impact">
          <option value="0"${(o.impact||0)===0?' selected':''}>0 — None</option>
          <option value="1"${(o.impact||0)===1?' selected':''}>1 — Low</option>
          <option value="2"${(o.impact||0)===2?' selected':''}>2 — Medium</option>
          <option value="3"${(o.impact||0)===3?' selected':''}>3 — High</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>Order</label>
        <input id="o-order" value="${o.order||''}" type="number" placeholder="optional">
      </div>
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="o-unchoosable" ${o.unchoosable?'checked':''}> Unchoosable
      </label>
    </div>
    <div class="form-group">
      <label>Powers</label>
      <div class="power-selector">${powers||'<div style="color:var(--muted);font-size:12px;padding:8px">No powers available</div>'}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveOriginEdit('${nsId}','${originId}')">Save</button>
    </div>
  `);
}

function saveOriginEdit(nsId, originId) {
  const ns = getNs(nsId);
  const o = ns.origins.find(o => o.id === originId);
  o.name = document.getElementById('o-name').value.trim() || o.name;
  o.description = document.getElementById('o-desc').value.trim();
  o.icon = document.getElementById('o-icon').value.trim() || '⭐';
  o.iconItem = document.getElementById('o-icon-item')?.value.trim() || 'minecraft:paper';
  o.impact = parseInt(document.getElementById('o-impact')?.value || '0');
  const ord = document.getElementById('o-order')?.value.trim();
  o.order = ord ? parseInt(ord) : undefined;
  o.unchoosable = document.getElementById('o-unchoosable')?.checked || false;
  o.powers = [...document.querySelectorAll('.power-select-item input:checked')].map(c => c.value);
  saveAndSync();
  closeModal();
  renderContent();
}

function showNewLayerModal(nsId) {
  const ns = getNs(nsId);
  const origins = (ns.origins || []).map(o => `
    <div class="power-select-item">
      <input type="checkbox" id="lo-${o.id}" value="${nsId}:${o.id}" checked>
      <label for="lo-${o.id}" style="cursor:pointer;flex:1">
        <div style="font-size:12px;font-weight:600">${o.name}</div>
        <div style="font-size:10px;color:var(--muted);font-family:monospace">${nsId}:${o.id}</div>
      </label>
    </div>
  `).join('');

  showModal(`
    <h3>New Origin Layer</h3>
    <div class="form-group">
      <label>Layer File Name (e.g. origin)</label>
      <input id="l-id" placeholder="origin" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')">
    </div>
    <div class="form-group">
      <label>Display Name</label>
      <input id="l-name" placeholder="e.g. Origin">
    </div>
    <div style="display:flex;gap:12px">
      <div class="form-group" style="flex:1">
        <label>Order</label>
        <input id="l-order" type="number" value="1" min="0">
      </div>
      <div class="form-group" style="flex:1">
        <label>Replace existing</label>
        <select id="l-replace">
          <option value="false">false (add to)</option>
          <option value="true">true (replace)</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Origins to include</label>
      <div class="power-selector">${origins || '<div style="color:var(--muted);font-size:12px;padding:8px">No origins yet</div>'}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createLayer('${nsId}')">Create</button>
    </div>
  `);
}

function createLayer(nsId) {
  const id = document.getElementById('l-id').value.trim() || 'origin';
  const name = document.getElementById('l-name').value.trim() || id;
  const order = parseInt(document.getElementById('l-order').value || '1');
  const replace = document.getElementById('l-replace').value === 'true';
  const origins = [...document.querySelectorAll('.power-select-item input:checked')].map(c => c.value);
  const ns = getNs(nsId);
  ns.layers = ns.layers || [];
  if (ns.layers.find(l => l.id === id)) { alert('Layer ID already exists'); return; }
  ns.layers.push({ id, name, order, replace, origins });
  saveAndSync();
  closeModal();
  renderContent();
}

function editLayer(nsId, layerId) {
  const ns = getNs(nsId);
  const l = (ns.layers || []).find(l => l.id === layerId);
  if (!l) return;

  const origins = (ns.origins || []).map(o => `
    <div class="power-select-item">
      <input type="checkbox" id="lo-${o.id}" value="${nsId}:${o.id}" ${(l.origins||[]).includes(nsId+':'+o.id)?'checked':''}>
      <label for="lo-${o.id}" style="cursor:pointer;flex:1">
        <div style="font-size:12px;font-weight:600">${o.name}</div>
        <div style="font-size:10px;color:var(--muted);font-family:monospace">${nsId}:${o.id}</div>
      </label>
    </div>
  `).join('');

  showModal(`
    <h3>Edit Layer: ${l.name}</h3>
    <div class="form-group">
      <label>Display Name</label>
      <input id="l-name" value="${l.name}">
    </div>
    <div style="display:flex;gap:12px">
      <div class="form-group" style="flex:1">
        <label>Order</label>
        <input id="l-order" type="number" value="${l.order ?? 1}" min="0">
      </div>
      <div class="form-group" style="flex:1">
        <label>Replace existing</label>
        <select id="l-replace">
          <option value="false" ${!l.replace?'selected':''}>false (add to)</option>
          <option value="true" ${l.replace?'selected':''}>true (replace)</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Origins</label>
      <div class="power-selector">${origins || '<div style="color:var(--muted);font-size:12px;padding:8px">No origins yet</div>'}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveLayerEdit('${nsId}','${layerId}')">Save</button>
    </div>
  `);
}

function saveLayerEdit(nsId, layerId) {
  const ns = getNs(nsId);
  const l = (ns.layers || []).find(l => l.id === layerId);
  l.name = document.getElementById('l-name').value.trim() || l.name;
  l.order = parseInt(document.getElementById('l-order').value || '1');
  l.replace = document.getElementById('l-replace').value === 'true';
  l.origins = [...document.querySelectorAll('.power-select-item input:checked')].map(c => c.value);
  saveAndSync();
  closeModal();
  renderContent();
}

function deleteLayer(nsId, layerId) {
  const ns = getNs(nsId);
  ns.layers = (ns.layers || []).filter(l => l.id !== layerId);
  saveAndSync();
  renderContent();
}

function renamePower(nsId, powerId) {
  const ns = getNs(nsId);
  const power = (ns.powers || []).find(p => p.id === powerId);
  if (!power) return;
  const newName = prompt('Rename power:', power.name);
  if (!newName || !newName.trim()) return;
  power.name = newName.trim();
  saveAndSync();
  renderContent();
}

function renameOrigin(nsId, originId) {
  const ns = getNs(nsId);
  const o = (ns.origins || []).find(o => o.id === originId);
  if (!o) return;
  const newName = prompt('Rename origin:', o.name);
  if (!newName || !newName.trim()) return;
  o.name = newName.trim();
  saveAndSync();
  renderContent();
}

function deleteOrigin(nsId, originId) {
  if(!collab.isHost && collab.active && !collab.settings.allowDelete) { alert("The host has not enabled this action."); return; }
  const ns = getNs(nsId);
  ns.origins = ns.origins.filter(o => o.id !== originId);
  saveAndSync();
  renderContent();
}

function showNewPowerModal(nsId) {
  showModal(`
    <h3>New Power</h3>
    <div class="form-group">
      <label>Power Name</label>
      <input id="p-name" placeholder="e.g. Elytra Flight">
    </div>
    <div class="form-group">
      <label>Power ID (auto-generated)</label>
      <input id="p-id" placeholder="elytra_flight" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')">
    </div>
    <div class="form-group">
      <label>Subfolder (optional, e.g. stormpiercer)</label>
      <input id="p-subfolder" placeholder="leave blank for no subfolder" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_\/]/g,'')">
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createPower('${nsId}')">Create & Edit</button>
    </div>
  `);
  document.getElementById('p-name').addEventListener('input', function() {
    const idField = document.getElementById('p-id');
    if (!idField._touched) idField.value = genId(this.value);
  });
  document.getElementById('p-id').addEventListener('input', function() { this._touched = true; });
}

function createPower(nsId) {
  if(!collab.isHost && collab.active && !collab.settings.allowCreate) { alert("The host has not enabled this action."); return; }
  const name = document.getElementById('p-name').value.trim();
  let id = document.getElementById('p-id').value.trim() || genId(name);
  if (!name) return;
  const ns = getNs(nsId);
  ns.powers = ns.powers || [];
  if (ns.powers.find(p => p.id === id)) { alert('Power ID already exists'); return; }
  const subfolder = document.getElementById('p-subfolder')?.value.trim().replace(/^\/|\/$/, '') || '';
  ns.powers.push({ id, name, subfolder, json: null, type: null });
  saveAndSync();
  closeModal();
  renderContent();
  // Open editor immediately
  setTimeout(() => openEditor(nsId, id), 100);
}

function deletePower(nsId, powerId) {
  if(!collab.isHost && collab.active && !collab.settings.allowDelete) { alert("The host has not enabled this action."); return; }
  const ns = getNs(nsId);
  ns.powers = ns.powers.filter(p => p.id !== powerId);
  ns.origins?.forEach(o => { o.powers = (o.powers||[]).filter(pid => pid !== powerId); });
  saveAndSync();
  renderContent();
}

function deleteNs(nsId) {
  state.namespaces = state.namespaces.filter(n => n.id !== nsId);
  saveAndSync();
  if (activeNs === nsId) {
    activeNs = null;
    document.getElementById('content').innerHTML = `<div class="content-empty"><div class="icon">📁</div><p>Select or create a namespace to get started</p></div>`;
  }
  renderSidebar();
}

// ── Editor ────────────────────────────────────────────────────────────────
function openEditor(nsId, powerId) {
  if(!collab.isHost && collab.active && !collab.settings.allowEdit) {
    alert('The host has not enabled editing powers.');
    return;
  }
  const ns = getNs(nsId);
  const power = (ns.powers || []).find(p => p.id === powerId);
  if (!power) return;

  editingPower = { nsId, powerId };
  document.getElementById('editor-power-name').textContent = power.name;
  document.getElementById('editor-power-id').textContent = `${nsId}:${powerId}`;

  const iframe = document.getElementById('editor-iframe');
  const overlay = document.getElementById('editor-overlay');

  if (overlay.classList.contains('hidden')) {
    // First open — iframe needs to load
    overlay.classList.remove('hidden');
    iframe.onload = () => {
      try {
        // Tell editor its peer ID so it can filter its own echoes
        if(collab.peer) {
          sendPeerIdToEditor();
        }
        if(collab.active && !collab.isHost) {
          iframe.contentWindow.postMessage({ type: 'LOAD_POWER', json: power.state || null, powerId: powerId }, '*');
          sendToHost({ type: 'REQUEST_CANVAS', nsId, powerId });
        } else {
          iframe.contentWindow.postMessage({ type: 'LOAD_POWER', json: power.state || null, powerId: powerId }, '*');
        }
      } catch(e) {}
    };
    if (!iframe.src || iframe.src === 'about:blank') {
      iframe.src = 'origins-editor.html';
    } else {
      // Already loaded — post directly
      setTimeout(() => {
        sendPeerIdToEditor();
        try {
          iframe.contentWindow.postMessage({ type: 'LOAD_POWER', json: power.state || null, powerId: powerId }, '*');
        } catch(e) {}
      }, 100);
    }
  } else {
    // Already open — just send LOAD_POWER
    overlay.classList.remove('hidden');
    setTimeout(() => {
      sendPeerIdToEditor();
      try {
        iframe.contentWindow.postMessage({ type: 'LOAD_POWER', json: power.state || null, powerId: powerId }, '*');
      } catch(e) {}
    }, 50);
  }
}

function openOverlay(type) {
  const overlay = document.getElementById(type + '-overlay');
  const iframe = document.getElementById(type + '-iframe');
  if(!overlay || !iframe) return;
  // Load src only once
  if(!iframe.src || iframe.src === 'about:blank' || iframe.src === window.location.href) {
    iframe.src = 'origins-' + type + '.html';
  }
  overlay.classList.remove('hidden');
}

function closeEditor() {
  document.getElementById('editor-overlay').classList.add('hidden');
  if(editingPower && collab.active) {
    // Snapshot current canvas state into power.state before closing
    // so peers who open it later get the latest version
    const iframe = document.getElementById('editor-iframe');
    if(iframe && iframe.contentWindow) {
      collab._closingPower = { nsId: editingPower.nsId, powerId: editingPower.powerId };
      try { iframe.contentWindow.postMessage({ type: 'REQUEST_CANVAS_STATE' }, '*'); } catch(e) {}
    }
  }
  editingPower = null;
}

function savePowerFromEditor() {
  if (!editingPower) return;
  const iframe = document.getElementById('editor-iframe');
  // Request JSON from editor
  iframe.contentWindow.postMessage({ type: 'REQUEST_JSON' }, '*');
}

// Listen for messages from editor
window.addEventListener('message', e => {
  // Bridge block actions from editor iframe to collab peers

  if(e.data?.type === 'EDITOR_DRAG_MOVE' && collab.active) {
    const myId = collab.lanMode ? collab.lanClientId : (collab.peer?.id || 'host');
    const myColor = collab.myColor || collab.peers.find(p=>p.connId===myId)?.color || '#7c5ce7';
    const msg = { type: 'PEER_DRAG_MOVE', id: e.data.id, x: e.data.x, y: e.data.y,
      powerId: e.data.powerId, peerId: myId, color: myColor };
    if(collab.lanMode) {
      if(collab.isHost) lanBroadcast(msg);
      else lanSend(msg, null, 'host');
    } else if(collab.isHost) {
      collabBroadcast(msg);
    } else {
      sendToHost(msg);
    }
  }
  if(e.data?.type === 'EDITOR_DRAG_END' && collab.active) {
    const myId = collab.lanMode ? collab.lanClientId : (collab.peer?.id || 'host');
    const msg = { type: 'PEER_DRAG_END', id: e.data.id, x: e.data.x, y: e.data.y,
      powerId: e.data.powerId, peerId: myId };
    if(collab.lanMode) {
      if(collab.isHost) lanBroadcast(msg);
      else lanSend(msg, null, 'host');
    } else if(collab.isHost) {
      collabBroadcast(msg);
    } else {
      sendToHost(msg);
    }
  }
  if(e.data?.type === 'EDITOR_ACTION') {
    if(collab.active) {
      const myId = collab.lanMode ? collab.lanClientId : (collab.peer?.id || 'host');
      const msg = { type: 'PEER_EDITOR_ACTION', action: e.data.action, powerId: e.data.powerId, senderId: myId };
      if(collab.fbMode) {
        const msgStr = JSON.stringify(msg);
        if(collab.isHost) {
          collab.peers.forEach(p => { if(p.dc && p.dc.readyState === 'open') try { p.dc.send(msgStr); } catch(e) {} });
        } else {
          const dc = collab._fbDc;
          if(dc && dc.readyState === 'open') try { dc.send(msgStr); } catch(e) {}
        }
      } else if(collab.lanMode) {
        if(collab.isHost) lanBroadcast(msg);
        else lanSend(msg, null, 'host');
      } else if(collab.isHost) {
        collabBroadcast(msg);
      } else {
        sendToHost(msg);
      }
    }
  }

  if(e.data?.type === 'CANVAS_STATE_RESPONSE') {
    // Handle close-editor snapshot save
    if(collab._closingPower) {
      const cp = collab._closingPower;
      collab._closingPower = null;
      const ns = getNs(cp.nsId);
      const power = ns?.powers?.find(p => p.id === cp.powerId);
      if(power) {
        power.state = e.data.state || null;
        saveAndSync(); // broadcast updated state to peers
      }
    }
    if(editingPower) {
      collabBroadcast({ type: 'CANVAS_STATE', nsId: editingPower.nsId, powerId: editingPower.powerId, state: e.data.state });
    }
  }
  if(e.data?.type === 'REQUEST_CANVAS_STATE' && collab.active && editingPower) {
    // Editor is asking manager to get its current state and broadcast to peers
    const iframe = document.getElementById('editor-iframe');
    if(iframe && iframe.contentWindow) {
      collab._broadcastOnResponse = true;
      collab._broadcastPowerId = e.data.powerId;
      iframe.contentWindow.postMessage({ type: 'REQUEST_CANVAS_STATE', powerId: e.data.powerId }, '*');
    }
  }
  if(e.data?.type === 'CANVAS_STATE_RESPONSE' && collab._broadcastOnResponse && editingPower) {
    collab._broadcastOnResponse = false;
    const msg = { type: 'CANVAS_STATE', nsId: editingPower.nsId, powerId: collab._broadcastPowerId, state: e.data.state };
    collabBroadcast(msg);
  }
  if(e.data?.type === 'CANVAS_STATE_RESPONSE' && collab._lanCanvasRequestDc) {
    const dc = collab._lanCanvasRequestDc;
    const msg = { type: 'CANVAS_STATE', nsId: collab._lanCanvasRequestNsId, powerId: collab._lanCanvasRequestPowerId, state: e.data.state };
    collab._lanCanvasRequestDc = null;
    if(dc && dc.readyState === 'open') dc.send(JSON.stringify(msg));
  }
  if(e.data?.type === 'OPEN_CHAT') {
    if(!chatOpen) toggleChat();
  }
  if(e.data?.type === 'CLOSE_OVERLAY') {
    const overlay = document.getElementById(e.data.overlay + '-overlay');
    if(overlay) overlay.classList.add('hidden');
  }
  if (e.data?.type === 'POWER_JSON' && editingPower) {
    const ns = getNs(editingPower.nsId);
    const power = (ns.powers || []).find(p => p.id === editingPower.powerId);
    if (power) {
      power.json = e.data.json;
      power.state = e.data.state || null;
      power.type = e.data.powerType || null;
      saveAndSync();
      renderContent();
      closeEditor();
    }
  }
});

// ── Export ZIP ────────────────────────────────────────────────────────────
async function exportZip() {
  const ns = getNs(activeNs);
  if (!ns) { alert('Select a namespace first'); return; }

  const files = {};

  // pack.mcmeta — required for datapack to be recognized by Minecraft
  // pack_format 15 = 1.20.1
  files['pack.mcmeta'] = JSON.stringify({
    pack: {
      pack_format: 15,
      description: `${ns.name} Origins`
    }
  }, null, 2);

  // Power files
  (ns.powers || []).forEach(p => {
    if (p.json) {
      const json = typeof p.json === 'string' ? p.json : JSON.stringify(p.json, null, 2);
      const powerPath = p.subfolder ? `${p.subfolder}/${p.id}` : p.id;
      files[`data/${ns.id}/powers/${powerPath}.json`] = json;
    }
  });

  // Origin layer file — required for origins to appear in selection screen

  // Origin files
  (ns.origins || []).forEach(o => {
    const originJson = {
      powers: (o.powers || []).map(pid => {
        const p = (ns.powers || []).find(p => p.id === pid);
        const powerPath = p?.subfolder ? `${p.subfolder}/${pid}` : pid;
        return `${ns.id}:${powerPath}`;
      }),
      icon: o.iconItem || 'minecraft:paper',
      impact: o.impact ?? 0,
      name: o.name,
      description: o.description || '',
    };
    if (o.order !== undefined && o.order !== '') originJson.order = parseInt(o.order);
    if (o.unchoosable) originJson.unchoosable = true;
    files[`data/${ns.id}/origins/${o.id}.json`] = JSON.stringify(originJson, null, 2);
  });

  // Origin layer files — one per defined layer
  (ns.layers || []).forEach(l => {
    const layerJson = { replace: l.replace || false, order: l.order ?? 1, origins: l.origins || [] };
    files[`data/origins/origin_layers/${l.id}.json`] = JSON.stringify(layerJson, null, 2);
  });

  // Check we have more than just pack.mcmeta
  const dataFiles = Object.keys(files).filter(k => k !== 'pack.mcmeta');
  if (dataFiles.length === 0) {
    alert('No powers or origins to export yet. Create some content first.');
    return;
  }

  // Build and download zip
  async function buildZip() {
    const zip = new JSZip();
    Object.entries(files).forEach(([path, content]) => zip.file(path, content));
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${ns.id}-origins.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  if (window.JSZip) {
    buildZip();
  } else {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = buildZip;
    script.onerror = () => alert('Failed to load JSZip. Check your internet connection.');
    document.head.appendChild(script);
  }
}

function pickUniqueColor() {
  // Get colors already in use
  const used = new Set([
    collab.myColor,
    ...collab.peers.map(p => p.color)
  ].filter(Boolean));
  // Shuffle PEER_COLORS and pick first unused one
  const available = PEER_COLORS.filter(c => !used.has(c));
  if(available.length > 0) {
    // Pick randomly from available
    return available[Math.floor(Math.random() * available.length)];
  }
  // All colors taken — generate a random hex color
  return '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
}

function applyRemoteState(remoteState, shouldSave) {
  if(collab.isHost) {
    // Host: update local state and save
    localState.namespaces = JSON.parse(JSON.stringify(remoteState.namespaces));
    state = localState;
    if(shouldSave) save();
  } else {
    // Joiner: deep clone into session state, never touch localState
    sessionState = { namespaces: JSON.parse(JSON.stringify(remoteState.namespaces)) };
    state = sessionState;
  }
  // Validate activeNs still exists
  if(activeNs && !state.namespaces.find(n => n.id === activeNs)) {
    activeNs = state.namespaces.length > 0 ? state.namespaces[0].id : null;
  }
  renderSidebar();
  if(activeNs) renderContent();
}

// ── Compress/decompress offer/answer strings ──────────────────────────────
async function compress(str) {
  const stream = new CompressionStream('deflate-raw');
  const writer = stream.writable.getWriter();
  writer.write(new TextEncoder().encode(str));
  writer.close();
  const chunks = [];
  const reader = stream.readable.getReader();
  while(true) {
    const {done, value} = await reader.read();
    if(done) break;
    chunks.push(value);
  }
  const compressed = new Uint8Array(chunks.reduce((a,b)=>a+b.length,0));
  let offset=0;
  chunks.forEach(c=>{compressed.set(c,offset);offset+=c.length;});
  return btoa(String.fromCharCode(...compressed))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function decompress(str) {
  const b64 = str.replace(/-/g,'+').replace(/_/g,'/');
  const padding = (4 - b64.length % 4) % 4;
  const binary = atob(b64 + '='.repeat(padding));
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const stream = new DecompressionStream('deflate-raw');
  const writer = stream.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const chunks = [];
  const reader = stream.readable.getReader();
  while(true) {
    const {done, value} = await reader.read();
    if(done) break;
    chunks.push(value);
  }
  const all = new Uint8Array(chunks.reduce((a,b)=>a+b.length,0));
  let offset=0;
  chunks.forEach(c=>{all.set(c,offset);offset+=c.length;});
  return new TextDecoder().decode(all);
}

// ── SDP strip/reconstruct ─────────────────────────────────────────────────
function stripSDP(sdpObj) {
  // Extract only the essential fields from SDP
  const sdp = sdpObj.sdp || '';
  const lines = sdp.split('\r\n');
  const get = (prefix) => {
    const l = lines.find(l => l.startsWith(prefix));
    return l ? l.slice(prefix.length) : '';
  };
  const getAll = (prefix) => lines.filter(l => l.startsWith(prefix)).map(l => l.slice(prefix.length));

  return {
    t: sdpObj.type,
    f: get('a=fingerprint:sha-256 '),
    u: get('a=ice-ufrag:'),
    p: get('a=ice-pwd:'),
    s: get('a=setup:'),
    c: getAll('a=candidate:').slice(0, 3), // keep up to 3 candidates
  };
}

function reconstructSDP(stripped) {
  const isOffer = stripped.t === 'offer';
  const candidates = (stripped.c || []).map(c => `a=candidate:${c}`).join('\r\n');
  const sdp = [
    'v=0',
    'o=- 1 1 IN IP4 127.0.0.1',
    's=-',
    't=0 0',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
    'c=IN IP4 0.0.0.0',
    `a=ice-ufrag:${stripped.u}`,
    `a=ice-pwd:${stripped.p}`,
    'a=ice-options:trickle',
    `a=fingerprint:sha-256 ${stripped.f}`,
    `a=setup:${stripped.s}`,
    'a=mid:0',
    'a=sctp-port:5000',
    'a=max-message-size:262144',
    candidates,
  ].filter(Boolean).join('\r\n') + '\r\n';
  return { type: stripped.t, sdp };
}

async function encodeSignal(sdpObj) {
  return await compress(JSON.stringify(sdpObj));
}

async function decodeSignal(str) {
  const decompressed = await decompress(str);
  return JSON.parse(decompressed);
}

function setupHostDataChannel(dc) {
  rtc.dcs.push(dc);
  dc._lastPong = Date.now();
  dc._connectedAt = null;
  dc.onopen = () => {
    dc._connectedAt = Date.now();
    dc._lastPong = Date.now();
    document.getElementById('rtc-dialog')?.remove();
    dc.send(JSON.stringify({ type: 'STATE_SYNC', state: getSharedState(),
      hostNickname: collab.myNickname, hostColor: collab.myColor }));
  };
  dc.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      if(data.type === 'PONG') { dc._lastPong = Date.now(); return; }
      if(data.type === 'PING') { try { dc.send(JSON.stringify({ type: 'PONG' })); } catch(e) {} return; }
      if(data.type === 'HELLO') {
        if(!rtc._dcPeerMap) rtc._dcPeerMap = new Map();
        rtc._dcPeerMap.set(dc, data.connId);
      }
      handleLANMessage(data, true, dc);
    } catch(err) {}
  };
  dc.onclose = () => {
    rtc.dcs = rtc.dcs.filter(d => d !== dc);
    const connId = rtc._dcPeerMap?.get(dc);
    if(connId) {
      collab.peers = collab.peers.filter(p => p.connId !== connId);
      rtc._dcPeerMap?.delete(dc);
    }
    renderCollabUI();
  };
}

async function generateRTCAnswer(nickname) {
  const ta = document.getElementById('rtc-offer-in');
  if(!ta || !ta.value.trim()) { alert('Paste the offer first'); return; }

  try {
    const offer = await decodeSignal(ta.value.trim());
    const pc = new RTCPeerConnection(RTC_CONFIG);
    rtc.pc = pc;

    pc.oniceconnectionstatechange = () => {
      const s = pc.iceConnectionState;
      if((s === 'failed' || s === 'closed') && collab.active) {
        collab.active = false;
        sessionState = null;
        state = localState;
        activeNs = localState.namespaces.length > 0 ? localState.namespaces[0].id : null;
        renderSidebar(); renderContent(); renderCollabUI();
      }
    };
    pc.ondatachannel = e => {
      const dc = e.channel;
      rtc.dc = dc;
      dc.onopen = () => {
        document.getElementById('rtc-dialog')?.remove();
        collab.active = true;
        collab.roomCode = 'LAN';
        // Send HELLO
        dc.send(JSON.stringify({ type: 'HELLO', nickname, connId: 'joiner-'+Math.random().toString(36).slice(2,8) }));
        renderCollabUI();
      };
      dc.onmessage = e => {
        try {
          const data = JSON.parse(e.data);
          if(data.type === 'PING') { try { dc.send(JSON.stringify({ type: 'PONG' })); } catch(e) {} return; }
          if(data.type === 'PONG') return;
          handleLANMessage(data, false, dc);
        } catch(err) {}
      };
      dc.onclose = () => {
        const pc = rtc.pc;
        const iceState = pc?.iceConnectionState;
        if(iceState === 'failed' || iceState === 'closed') {
          if(collab.active) {
            collab.active = false;
            sessionState = null;
            state = localState;
            activeNs = localState.namespaces.length > 0 ? localState.namespaces[0].id : null;
            renderSidebar(); renderContent(); renderCollabUI();
          }
        } else {
          // Transient close — wait and check again
          setTimeout(() => {
            const s2 = rtc.pc?.iceConnectionState;
            if((s2 === 'failed' || s2 === 'closed' || dc.readyState === 'closed') && collab.active) {
              collab.active = false;
              sessionState = null;
              state = localState;
              activeNs = localState.namespaces.length > 0 ? localState.namespaces[0].id : null;
              renderSidebar(); renderContent(); renderCollabUI();
            }
          }, 3000);
        }
      };
    };

    let _answerShown = false;
    const _showAnswer = () => {
      if(_answerShown) return;
      _answerShown = true;
      encodeSignal(pc.localDescription).then(encoded => {
        const out = document.getElementById('rtc-answer-out');
        if(out) out.value = encoded;
      });
    };
    pc.onicecandidate = e => { if(!e.candidate) _showAnswer(); };
    pc.onicegatheringstatechange = () => { if(pc.iceGatheringState === 'complete') _showAnswer(); };
    setTimeout(_showAnswer, 1500); // max wait 1.5s

    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

  } catch(e) {
    alert('Invalid offer: ' + e.message);
  }
}

function lanSend(msg, excludeId, targetId) {
  // In WebRTC mode, send to all data channels (host) or the single dc (joiner)
  const data = JSON.stringify(msg);
  if(collab.isHost) {
    rtc.dcs.forEach(dc => { if(dc.readyState === 'open') try { dc.send(data); } catch(e) {} });
  } else {
    if(rtc.dc && rtc.dc.readyState === 'open') try { rtc.dc.send(data); } catch(e) {}
  }
}

      if(p.dc && p.dc.readyState === 'open') try { p.dc.send(str); } catch(e) {}

function handleLANMessage(data, isHost, sourceDc) {
  if(data.type === 'HELLO') {
    const color = pickUniqueColor();
    collab.peers.push({ nickname: data.nickname, connId: data.connId, color });
    collab.active = true;
    renderCollabUI();
    sourceDc?.send(JSON.stringify({ type: 'YOUR_COLOR', color }));
    sourceDc?.send(JSON.stringify({ type: 'STATE_SYNC', state: getSharedState(),
      hostNickname: collab.myNickname, hostColor: collab.myColor }));
    // Notify other peers
    rtc.dcs.filter(d => d !== sourceDc).forEach(d => {
      if(d.readyState === 'open') d.send(JSON.stringify({ type: 'PEER_JOIN', nickname: data.nickname, color, connId: data.connId }));
    });
  }
  if(data.type === 'STATE_SYNC') {
    applyRemoteState(data.state, false);
    if(!isHost && data.hostNickname && !collab.peers.find(p => p.isHost)) {
      collab.peers = collab.peers.filter(p => !p.isHost);
      collab.peers.unshift({ nickname: data.hostNickname, color: data.hostColor || '#7c5ce7',
        connId: 'host', isHost: true });
      renderCollabUI();
    }
  }
  if(data.type === 'STATE_PATCH') {
    if(isHost) {
      applyRemoteState(data.state, true);
      rtc.dcs.filter(d => d !== sourceDc).forEach(d => {
        if(d.readyState === 'open') d.send(JSON.stringify({ type: 'STATE_PATCH', state: getSharedState() }));
      });
    } else {
      applyRemoteState(data.state, false);
    }
  }
  if(data.type === 'PEER_JOIN') {
    if(!collab.peers.find(p => p.connId === data.connId))
      collab.peers.push({ nickname: data.nickname, connId: data.connId, color: data.color });
    renderCollabUI();
  }
  if(data.type === 'CANVAS_STATE') {
    if(editingPower && editingPower.nsId === data.nsId && editingPower.powerId === data.powerId) {
      const iframe = document.getElementById('editor-iframe');
      if(iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'LOAD_POWER', json: data.state, powerId: data.powerId }, '*');
      }
    }
  }
  if(data.type === 'PEER_LEAVE') {
    collab.peers = collab.peers.filter(p => p.connId !== data.connId);
    renderCollabUI();
  }
  if(data.type === 'CHAT_MSG') {
    receiveChat(data);
    if(isHost) {
      rtc.dcs.filter(d => d !== sourceDc).forEach(d => {
        if(d.readyState === 'open') d.send(JSON.stringify(data));
      });
    }
  }
  if(data.type === 'REQUEST_CANVAS') {
    const ns = (isHost ? localState : (sessionState||localState)).namespaces.find(n => n.id === data.nsId);
    const power = ns?.powers?.find(p => p.id === data.powerId);
    if(power) {
      if(editingPower && editingPower.nsId === data.nsId && editingPower.powerId === data.powerId) {
        // Get live state from our editor
        const iframe = document.getElementById('editor-iframe');
        if(iframe && iframe.contentWindow) {
          collab._lanCanvasRequestDc = sourceDc;
          collab._lanCanvasRequestNsId = data.nsId;
          collab._lanCanvasRequestPowerId = data.powerId;
          iframe.contentWindow.postMessage({ type: 'REQUEST_CANVAS_STATE' }, '*');
        }
      } else {
        const reply = { type: 'CANVAS_STATE', nsId: data.nsId, powerId: data.powerId, state: power.state || null };
        sourceDc?.send(JSON.stringify(reply));
      }
    }
  }
  if(data.type === 'SETTINGS_UPDATE') {
    Object.assign(collab.settings, data.settings);
    renderCollabUI();
  }
  if(data.type === 'SESSION_ENDED') { endSession(); }
  if(data.type === 'KICKED') { endSession(); alert('You were kicked.'); }
  if(data.type === 'PEER_DRAG_MOVE' || data.type === 'PEER_DRAG_END') {
    if(editingPower && data.powerId === editingPower.powerId) {
      const iframe = document.getElementById('editor-iframe');
      if(iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage(data, '*');
      }
    }
    if(isHost) {
      rtc.dcs.filter(d => d !== sourceDc).forEach(d => {
        if(d.readyState === 'open') d.send(JSON.stringify(data));
      });
    }
  }
  if(data.type === 'PEER_EDITOR_ACTION') {
    if(editingPower && data.powerId === editingPower.powerId) {
      const iframe = document.getElementById('editor-iframe');
      if(iframe && iframe.contentWindow) {
        sendPeerIdToEditor();
        iframe.contentWindow.postMessage({ type: 'PEER_ACTION', action: data.action, senderId: data.senderId }, '*');
      }
    }
    if(isHost) {
      rtc.dcs.filter(d => d !== sourceDc).forEach(d => {
        if(d.readyState === 'open') d.send(JSON.stringify(data));
      });
    }
  }
}

async function fbAuthRequest(endpoint, body) {
  const res = await fetch(`${FB_AUTH_URL}:${endpoint}?key=${FB_API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data;
}

async function fbAuthWrite(path, data, idToken) {
  const res = await fetch(`${FB_URL}/${path}.json?auth=${idToken}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  return await res.json();
}

async function fbAuthRead(path, idToken) {

}

async function signUp(email, password, username) {
  // Check username availability
  const uname = username.toLowerCase().trim();
  if(!/^[a-z0-9_]{3,20}$/.test(uname)) throw new Error('Username must be 3-20 chars, letters/numbers/underscores only');
  const existing = await fbRead(`usernames/${uname}`);
  if(existing) throw new Error('Username already taken');

  // Create auth account
  const data = await fbAuthRequest('signUp', { email, password, returnSecureToken: true });
  const { localId: uid, idToken, refreshToken } = data;

  // Store user data
  await fbAuthWrite(`users/${uid}`, { username, email, createdAt: Date.now() }, idToken);
  await fbAuthWrite(`usernames/${uname}`, uid, idToken);

  authUser = { uid, email, username, idToken, refreshToken };
  localStorage.setItem('ob-auth', JSON.stringify({ email, refreshToken }));
  await setPresence(uid, idToken);
  return authUser;
}

  if(data.error) throw new Error(data.error.message);
  return { idToken: data.id_token, refreshToken: data.refresh_token, uid: data.user_id };

  const label = document.getElementById('account-btn-label');
  if(label) label.textContent = '👤 ' + userData.username;
  renderAccountUI();
}

// Expose to window for Firebase SDK module
window._handleGoogleSignIn = handleGoogleSignIn;

async function autoSignIn() {
  const saved = localStorage.getItem('ob-auth');
  if(!saved) return false;
  try {
    const parsed = JSON.parse(saved);
    // Google users need to re-authenticate via Firebase SDK
    if(parsed.isGoogle) {
      // Can't auto-restore Google session via REST — user needs to click sign in again
      localStorage.removeItem('ob-auth');
      return false;
    }
    const { refreshToken } = parsed;
    const { idToken, uid, refreshToken: newRefresh } = await refreshIdToken(refreshToken);
    const userData = await fbAuthRead(`users/${uid}`, idToken);
    if(!userData) return false;
    authUser = { uid, email: userData.email, username: userData.username, idToken, refreshToken: newRefresh };
    localStorage.setItem('ob-auth', JSON.stringify({ email: userData.email, refreshToken: newRefresh }));
    await setPresence(uid, idToken);
    return true;
  } catch(e) {
    localStorage.removeItem('ob-auth');
    return false;
  }
}

function signOut() {
  if(authUser) clearPresence(authUser.uid, authUser.idToken);
  if(authUser?.isGoogle && window._googleSignOut) window._googleSignOut();
  authUser = null;
  localStorage.removeItem('ob-auth');
  renderAccountUI();
  renderCollabUI();
}

async function setPresence(uid, idToken) {
  await fbAuthWrite(`users/${uid}/online`, true, idToken);
}

async function clearPresence(uid, idToken) {
  await fbAuthWrite(`users/${uid}/online`, null, idToken);
}

// ── Friend System ─────────────────────────────────────────────────────────
async function searchUser(username) {
  const uname = username.toLowerCase().trim();
  const uid = await fbRead(`usernames/${uname}`);
  if(!uid || uid === authUser?.uid) return null;
  const userData = await fbAuthRead(`users/${uid}`, authUser?.idToken);
  if(!userData) return null;
  return { uid, username: userData.username, online: userData.online || false };
}

async function sendFriendRequest(targetUid) {
  if(!authUser) return;
  await fbAuthWrite(
    `users/${targetUid}/friendRequests/${authUser.uid}`,
    { from: authUser.uid, username: authUser.username, timestamp: Date.now() },
    authUser.idToken
  );
}

async function acceptFriendRequest(fromUid) {
  if(!authUser) return;
  // Add to both friend lists
  await fbAuthWrite(`users/${authUser.uid}/friends/${fromUid}`, { since: Date.now() }, authUser.idToken);
  await fbAuthWrite(`users/${fromUid}/friends/${authUser.uid}`, { since: Date.now() }, authUser.idToken);
  // Remove request
  await fbAuthWrite(`users/${authUser.uid}/friendRequests/${fromUid}`, null, authUser.idToken);
}

async function declineFriendRequest(fromUid) {
  if(!authUser) return;
  await fbAuthWrite(`users/${authUser.uid}/friendRequests/${fromUid}`, null, authUser.idToken);
}

async function removeFriend(friendUid) {
  if(!authUser) return;
  await fbAuthWrite(`users/${authUser.uid}/friends/${friendUid}`, null, authUser.idToken);
  await fbAuthWrite(`users/${friendUid}/friends/${authUser.uid}`, null, authUser.idToken);
}

async function getFriends() {
  if(!authUser) return [];
  const friends = await fbAuthRead(`users/${authUser.uid}/friends`, authUser.idToken);
  if(!friends) return [];
  // Get each friend's info
  const results = await Promise.all(Object.keys(friends).map(async uid => {
    const data = await fbAuthRead(`users/${uid}`, authUser.idToken);
    return data ? { uid, username: data.username, online: data.online || false } : null;
  }));
  return results.filter(Boolean);
}

async function getFriendRequests() {
  if(!authUser) return [];
  const requests = await fbAuthRead(`users/${authUser.uid}/friendRequests`, authUser.idToken);
  if(!requests) return [];
  return Object.entries(requests).map(([uid, data]) => ({ uid, ...data }));
}

async function sendInvite(targetUid, roomCode) {
  if(!authUser) return;
  await fbAuthWrite(
    `users/${targetUid}/invite`,
    { from: authUser.uid, username: authUser.username, roomCode, timestamp: Date.now() },
