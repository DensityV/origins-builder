  accent:       EDITOR_SETTINGS.accent      || '#7c5ce7',
  blockColors:  EDITOR_SETTINGS.blockColors || {},
};

// Apply block color overrides to C object (done after C is defined)
function applyBlockColorSettings(){
  if(!EDITOR_SETTINGS.blockColors) return;
  Object.entries(EDITOR_SETTINGS.blockColors).forEach(([key, val]) => {
    if(C[key] && val){ Object.assign(C[key], val); }
  });
}

// ── Tooltip ───────────────────────────────────────────────────────────────
function Tooltip({text,children,side="top"}){
  const [pos,setPos]=useState(null);
  function show(e){
    if(!text)return;
    const r=e.currentTarget.getBoundingClientRect();
    setPos({x:r.left+r.width/2, y:side==="top"?r.top-4:r.bottom+4});
  }
  return h("span",{
    onMouseEnter:show, onMouseLeave:()=>setPos(null),
    style:{display:"inline-flex",alignItems:"center",position:"relative"}
  },
    children,
    pos&&h("div",{style:{
      position:"fixed",left:pos.x,top:pos.y,
      transform:side==="top"?"translate(-50%,-100%)":"translate(-50%,0%)",
      background:"#0f172a",color:"#cbd5e1",fontSize:10,padding:"5px 9px",
      borderRadius:7,whiteSpace:"pre-wrap",maxWidth:260,pointerEvents:"none",
      zIndex:9999,lineHeight:1.55,border:"1px solid rgba(148,163,184,0.25)",
      fontFamily:"'Segoe UI',monospace",boxShadow:"0 4px 16px rgba(0,0,0,0.6)",
    }},text)
  );
}

// JSON GENERATION

function cvt(v){
  if(v==="true")return true; if(v==="false")return false;
  const n=Number(v); return v!==""&&!isNaN(n)?n:v;
}
function b2j(id,bmap){
  const b=bmap[id]; if(!b)return null;
  const def=DEFS[b.bname], obj={};
  if(def.pt)obj.type=def.pt; if(def.ct)obj.type=def.ct; if(def.at)obj.type=def.at;

  // Special case: Multiple power — sub-powers become inline named keys
  if(def.isMultiple){
    const subIds=b.children["subpowers"]||[];
    subIds.forEach((cid,i)=>{
      const cb=bmap[cid];
      const key=(cb&&cb.vals&&cb.vals.name&&cb.vals.name.trim())||("sub_power_"+(i+1));
      const subJson=b2j(cid,bmap);
      if(subJson) obj[key]=subJson;
    });
    return obj;
  }

  // Standard fields
  def.fields.forEach(f=>{
    const v=b.vals[f.k];
    if(v===undefined||v==="")return; // skip blank fields
    if(f.k==="name")return; // name handled separately below
    obj[f.k]=cvt(v);
  });
  // Include name only if non-blank (used for file naming, not always needed in JSON)
  if(b.vals.name&&b.vals.name.trim())obj.name=b.vals.name.trim();

  // Stacking Status Effect: build effect object from flattened fields
  if(def.pt==="origins:stacking_status_effect"&&b.vals.effect_id){
    obj.effect={effect:b.vals.effect_id};
    if(b.vals.effect_amplifier!=="0")obj.effect.amplifier=cvt(b.vals.effect_amplifier);
    if(b.vals.effect_ambient!=="true")obj.effect.is_ambient=cvt(b.vals.effect_ambient);
    if(b.vals.effect_show_particles!=="false")obj.effect.show_particles=cvt(b.vals.effect_show_particles);
    // remove flattened keys from obj
    delete obj.effect_id; delete obj.effect_amplifier; delete obj.effect_ambient; delete obj.effect_show_particles;
  }

  // Attribute and related: build modifier object from flattened fields
  if((def.pt==="origins:attribute"||def.pt==="origins:conditioned_attribute"||def.pt==="origins:attribute_modify_transfer"||def.pt==="origins:modify_attribute")&&b.vals.modifier_attribute){
    const mod={attribute:b.vals.modifier_attribute,operation:b.vals.modifier_operation||"addition",value:cvt(b.vals.modifier_value||"0")};
    if(b.vals.modifier_name)mod.name=b.vals.modifier_name;
    obj.modifier=mod;
    delete obj.modifier_attribute; delete obj.modifier_operation; delete obj.modifier_value; delete obj.modifier_name;
  }

  // Modify_* powers: build modifier object
  if(def.pt&&def.pt.startsWith("origins:modify_")&&b.vals.modifier_value!==undefined&&
     !["origins:modify_block_render","origins:modify_camera_submersion","origins:modify_fluid_render",
       "origins:modify_player_spawn","origins:modify_crafting","origins:modify_harvest",
       "origins:modify_grindstone","origins:modify_food",
       "origins:modify_status_effect_amplifier","origins:modify_status_effect_duration",
       "origins:modify_velocity"].includes(def.pt)){
    const mod={operation:b.vals.modifier_operation||"addition",value:cvt(b.vals.modifier_value||"0")};
    obj.modifier=mod;
    delete obj.modifier_operation; delete obj.modifier_value;
  }

  // Modify Status Effect Amplifier/Duration: build modifier object (always)
  if(def.pt==="origins:modify_status_effect_amplifier"||def.pt==="origins:modify_status_effect_duration"){
    const mod={operation:b.vals.modifier_operation||"addition",value:cvt(b.vals.modifier_value||"1")};
    obj.modifier=mod;
    delete obj.modifier_operation; delete obj.modifier_value;
  }

  // Modify Velocity: parse axes as comma-separated text, build modifier
  if(def.pt==="origins:modify_velocity"){
    const rawAxes=(b.vals.axes||"x,y,z").split(",").map(a=>a.trim()).filter(Boolean);
    obj.axes=rawAxes; // overwrite the text field with the parsed array
    const mod={operation:b.vals.modifier_operation||"multiply_total",value:cvt(b.vals.modifier_value||"-2")};
    obj.modifier=mod;
    delete obj.modifier_operation; delete obj.modifier_value;
  }

  // Starting Equipment: build stack object
  if(def.pt==="origins:starting_equipment"&&b.vals.stack_item){
    const stack={item:b.vals.stack_item};
    if(b.vals.stack_amount&&b.vals.stack_amount!=="1")stack.amount=cvt(b.vals.stack_amount);
    if(b.vals.stack_slot&&b.vals.stack_slot!=="")stack.slot=cvt(b.vals.stack_slot);
    if(b.vals.stack_tag&&b.vals.stack_tag!=="")stack.tag=b.vals.stack_tag;
    obj.stack=stack;
    delete obj.stack_item; delete obj.stack_amount; delete obj.stack_slot; delete obj.stack_tag;
  }

  // Give: build stack object
  if(def.at==="origins:give"&&b.vals.stack_item){
    const stack={item:b.vals.stack_item};
    if(b.vals.stack_amount&&b.vals.stack_amount!=="1")stack.amount=cvt(b.vals.stack_amount);
    obj.stack=stack;
    delete obj.stack_item; delete obj.stack_amount;
  }

  // Replace Inventory: build stack object
  if(def.at==="origins:replace_inventory"&&b.vals.stack_item){
    const stack={item:b.vals.stack_item};
    if(b.vals.stack_amount&&b.vals.stack_amount!=="1")stack.amount=cvt(b.vals.stack_amount);
    obj.stack=stack;
    delete obj.stack_item; delete obj.stack_amount;
  }

  // Spawn Entity: clean up empty tag
  if(def.at==="origins:spawn_entity"){if(!obj.tag)delete obj.tag;}

  // Fire Projectile: clean up empty tag
  if(def.at==="origins:fire_projectile"){if(!obj.tag)delete obj.tag;}

  // Damage: damage_type outputs directly as namespaced identifier

  // Hands field: convert string "[main_hand, off_hand]" to array
  if(obj.hands&&typeof obj.hands==="string"){
    obj.hands=obj.hands.replace(/[\[\]]/g,"").split(",").map(h=>h.trim()).filter(Boolean);
  }

  // Modify Resource: 1.20.1 uses operation + value directly (no modifier object wrapper)
  if(def.at==="origins:modify_resource"){
    if(obj.modifier_operation!==undefined){obj.operation=obj.modifier_operation;delete obj.modifier_operation;}
    if(obj.modifier_value!==undefined){obj.value=cvt(String(obj.modifier_value));delete obj.modifier_value;}
  }

  // Add XP: skip empty optional fields
  if(def.at==="origins:add_xp"){
    if(!obj.points&&obj.points!==0)delete obj.points;
    if(!obj.levels&&obj.levels!==0)delete obj.levels;
  }

  // Edible Item: build food_component nested object from flat fields
  if(def.pt==="origins:edible_item"){
    const fc={hunger:cvt(b.vals.food_hunger||"4"),saturation:cvt(b.vals.food_saturation||"0.3")};
    if(b.vals.food_meat==="true")fc.meat=true;
    if(b.vals.food_snack==="true")fc.snack=true;
    obj.food_component=fc;
    delete obj.food_hunger; delete obj.food_saturation; delete obj.food_meat; delete obj.food_snack;
    if(b.vals.result_item&&b.vals.result_item.trim()){
      const rs={item:b.vals.result_item};
      if(b.vals.result_amount&&b.vals.result_amount!=="1")rs.amount=cvt(b.vals.result_amount);
      obj.result_stack=rs;
    }
    delete obj.result_item; delete obj.result_amount;
  }

  // Biome condition: convert biomes comma-sep string to array
  if(def.ct==="origins:biome"){
    if(obj.biomes&&typeof obj.biomes==="string"&&obj.biomes.trim()){
      obj.biomes=obj.biomes.split(",").map(b=>b.trim()).filter(Boolean);
    } else {
      delete obj.biomes;
    }
    if(!obj.biome||obj.biome==="")delete obj.biome;
  }

  // Spawn Particles: delete particle from standard passthrough (handled below)
  if(def.at==="origins:spawn_particles") delete obj.particle;

  // Spawn Particles: build particle object from type+params fields
  if(def.at==="origins:spawn_particles"&&b.vals.particle){
    if(b.vals.particle_params&&b.vals.particle_params.trim()){
      obj.particle={type:b.vals.particle,params:b.vals.particle_params};
    } else {
      obj.particle=b.vals.particle;
    }
    delete obj.particle_params;
  }

  // Spawn Particles spread: build spread object
  if(def.at==="origins:spawn_particles"){
    const sx=cvt(b.vals.spread_x||"0.5"),sy=cvt(b.vals.spread_y||"0.5"),sz=cvt(b.vals.spread_z||"0.5");
    obj.spread={x:sx,y:sy,z:sz};
    delete obj.spread_x; delete obj.spread_y; delete obj.spread_z;
  }

  // Modify Grindstone: build xp_modifier and result_stack objects
  if(def.pt==="origins:modify_grindstone"){
    if(b.vals.xp_mod_val!==undefined&&b.vals.xp_mod_val!==""){
      obj.xp_modifier={operation:b.vals.xp_mod_op||"multiply_total",value:cvt(b.vals.xp_mod_val)};
    }
    delete obj.xp_mod_op; delete obj.xp_mod_val;
    if(b.vals.result_stack_item&&b.vals.result_stack_item!==""){
      const rs={item:b.vals.result_stack_item};
      if(b.vals.result_stack_amount&&b.vals.result_stack_amount!=="1")rs.amount=cvt(b.vals.result_stack_amount);
      obj.result_stack=rs;
    }
    delete obj.result_stack_item; delete obj.result_stack_amount;
  }

  // Modify Food: build food_modifier and saturation_modifier objects
  if(def.pt==="origins:modify_food"){
    if(b.vals.food_mod_val!==undefined&&b.vals.food_mod_val!==""){
      obj.food_modifier={operation:b.vals.food_mod_op||"addition",value:cvt(b.vals.food_mod_val)};
    }
    if(b.vals.sat_mod_val!==undefined&&b.vals.sat_mod_val!==""){
      obj.saturation_modifier={operation:b.vals.sat_mod_op||"addition",value:cvt(b.vals.sat_mod_val)};
    }
    delete obj.food_mod_op; delete obj.food_mod_val;
    delete obj.sat_mod_op; delete obj.sat_mod_val;
  }

  // Spawn Effect Cloud: build effect object from flattened fields
  if(def.at==="origins:spawn_effect_cloud"&&b.vals.effect_id){
    const eff={effect:b.vals.effect_id,duration:cvt(b.vals.effect_duration||"200"),amplifier:cvt(b.vals.effect_amplifier||"0")};
    obj.effect=eff;
    delete obj.effect_id; delete obj.effect_amplifier; delete obj.effect_duration;
  }

  // Apply Effect: build effect object from flattened fields
  if(def.at==="origins:apply_effect"&&b.vals.effect_id){
    const eff={effect:b.vals.effect_id,duration:cvt(b.vals.effect_duration||"100"),amplifier:cvt(b.vals.effect_amplifier||"0")};
    if(b.vals.effect_is_ambient==="true")eff.is_ambient=true;
    if(b.vals.effect_show_particles==="false")eff.show_particles=false;
    if(b.vals.effect_show_icon==="false")eff.show_icon=false;
    obj.effect=eff;
    delete obj.effect_id; delete obj.effect_duration; delete obj.effect_amplifier;
    delete obj.effect_is_ambient; delete obj.effect_show_particles; delete obj.effect_show_icon;
  }

  // Slots
  (def.slots||[]).forEach(slot=>{
    const ids=b.children[slot.key]||[];
    if(!ids.length)return;
    const js=ids.map(cid=>b2j(cid,bmap)).filter(Boolean);
    if(slot.multi){obj[slot.key]=js;}
    else if(js.length===1){obj[slot.key]=js[0];}
    else{const isC=slot.accepts.includes("condition");obj[slot.key]={type:"origins:and",[isC?"conditions":"actions"]:js};}
  });
  return obj;
}
function genFiles(roots,bmap){
  const files=[];
  roots.forEach(id=>{
    const b=bmap[id]; if(!b)return;
    const def=DEFS[b.bname];
    if(def.cat==="origin"){
      const oid=b.vals.id||"my_origin";
      files.push({name:`data/custom/origins/${oid}.json`,json:b2j(id,bmap)});
      (b.children.powers||[]).forEach(pid=>{
        const pb=bmap[pid]; if(!pb)return;
        files.push({name:`data/custom/powers/${oid}/${pb.vals.name||"power"}.json`,json:b2j(pid,bmap)});
      });
    } else if(def.cat==="power"){
      files.push({name:`data/custom/powers/${b.vals.name||"power"}.json`,json:b2j(id,bmap)});
    }
  });
  return files;
}

// ═══════════════════════════════════════════════════════════════
// SCRATCH-STYLE SVG BLOCK SHAPE
// – Hat block (origin): rounded top, notch bottom
// ═══════════════════════════════════════════════════════════════
// Notch system — parent bottom has bump DOWN, child top has socket (recess DOWN)
// Child slides up by NH so socket wraps around parent's bump
// ═══════════════════════════════════════════════════════════════
const NW=32, NW_ROOT=32, NH=16, NI=15, NX=20, NX_ROOT=37, R=8, CR=8; // NX_ROOT shifts bump right to align with child notch

function stackPath(w,h,isChild){
  let d;
  if(isChild){
    // Notch DOWN at NX position (same as parent bump) — socket that fits parent bump
    d =`M${R},0 L${NX-CR},0 Q${NX},0 ${NX},${CR} L${NX},${NI-CR} Q${NX},${NI} ${NX+CR},${NI} L${NX+NW-CR},${NI} Q${NX+NW},${NI} ${NX+NW},${NI-CR} L${NX+NW},${CR} Q${NX+NW},0 ${NX+NW+CR},0 L${w-R},0 Q${w},0 ${w},${R} `;
    d+=`L${w},${h-R} Q${w},${h} ${w-R},${h} `;
    d+=`L${NX_ROOT+NW_ROOT+CR},${h} Q${NX_ROOT+NW_ROOT},${h} ${NX_ROOT+NW_ROOT},${h+CR} L${NX_ROOT+NW_ROOT},${h+NH-CR} Q${NX_ROOT+NW_ROOT},${h+NH} ${NX_ROOT+NW_ROOT-CR},${h+NH} L${NX_ROOT+CR},${h+NH} Q${NX_ROOT},${h+NH} ${NX_ROOT},${h+NH-CR} L${NX_ROOT},${h+CR} Q${NX_ROOT},${h} ${NX_ROOT-CR},${h} `;
    d+=`L${R},${h} Q0,${h} 0,${h-R} L0,${R} Q0,0 ${R},0 Z`;
  } else {
    // Root: flat top with rounded corners, bump on bottom
    d =`M${R},0 L${w-R},0 Q${w},0 ${w},${R} `;
    d+=`L${w},${h-R} Q${w},${h} ${w-R},${h} `;
    d+=`L${NX_ROOT+NW_ROOT+CR},${h} Q${NX_ROOT+NW_ROOT},${h} ${NX_ROOT+NW_ROOT},${h+CR} L${NX_ROOT+NW_ROOT},${h+NH-CR} Q${NX_ROOT+NW_ROOT},${h+NH} ${NX_ROOT+NW_ROOT-CR},${h+NH} L${NX_ROOT+CR},${h+NH} Q${NX_ROOT},${h+NH} ${NX_ROOT},${h+NH-CR} L${NX_ROOT},${h+CR} Q${NX_ROOT},${h} ${NX_ROOT-CR},${h} `;
    d+=`L${R},${h} Q0,${h} 0,${h-R} L0,${R} Q0,0 ${R},0 Z`;
  }
  return d;
}
function hatPath(w,h){
  // power block: fully rounded top, bump on bottom shifted to align with child notch
  let d=`M${R},0 Q0,0 0,${R} `;
  d+=`L0,${h-R} Q0,${h} ${R},${h} `;
  d+=`L${NX_ROOT-CR},${h} Q${NX_ROOT},${h} ${NX_ROOT},${h+CR} L${NX_ROOT},${h+NH-CR} Q${NX_ROOT},${h+NH} ${NX_ROOT+CR},${h+NH} L${NX_ROOT+NW_ROOT-CR},${h+NH} Q${NX_ROOT+NW_ROOT},${h+NH} ${NX_ROOT+NW_ROOT},${h+NH-CR} L${NX_ROOT+NW_ROOT},${h+CR} Q${NX_ROOT+NW_ROOT},${h} ${NX_ROOT+NW_ROOT+CR},${h} `;
  d+=`L${w-R},${h} Q${w},${h} ${w},${h-R} L${w},${R} Q${w},0 ${w-R},0 Z`;
  return d;
}
function headerPath(w,isChild){
  if(isChild){
    // Header: flat top with notch down at NX matching parent bump
    return `M${R},0 L${NX-CR},0 Q${NX},0 ${NX},${CR} L${NX},${NI-CR} Q${NX},${NI} ${NX+CR},${NI} L${NX+NW-CR},${NI} Q${NX+NW},${NI} ${NX+NW},${NI-CR} L${NX+NW},${CR} Q${NX+NW},0 ${NX+NW+CR},0 L${w-R},0 Q${w},0 ${w},${R} L${w},34 L0,34 L0,${R} Q0,0 ${R},0 Z`;
  }
  return `M${R},0 L${w-R},0 Q${w},0 ${w},${R} L${w},34 L0,34 L0,${R} Q0,0 ${R},0 Z`;
}

// ═══════════════════════════════════════════════════════════════
// BLOCK COMPONENT  — renders one block + nested children inline
// ═══════════════════════════════════════════════════════════════
const BW = 300;   // default block width
function calcBW(def){
  const badgeText=def.subcat?def.subcat.replace(/_meta$/,"").toUpperCase()+" "+def.cat.toUpperCase():def.cat==="meta"?"META":def.cat.toUpperCase();
  const badgeW=badgeText.length*6+28;
  const nameW=(def.bname||"").length*8;
  const btnsW=90;
  const headerW=badgeW+nameW+btnsW+24;
  // Label col is fixed minWidth:70 in CSS, input is flex:1
  // Total min = padding(20) + labelCol(70) + gap(6) + inputMin(140) + padding(20) = 256
  const fieldContentW=256;
  return Math.min(Math.max(headerW,fieldContentW,260),520);
}
const BPH = 8;   // vertical padding inside block body
const FH  = 26;   // height per field row
const SLOT_PAD = 8; // padding around slot areas

function ScratchBlock({id,bmap,isChild,isSibling,depth,dispatch,hoveredId,selectedId,setHoveredId,setSelectedId,mouseOverSlot,peerDragColor}){
  const b=bmap[id]; if(!b)return null;
  const def=DEFS[b.bname];
  const subcatKey=def.subcat||""; const baseSubcat=(def.subcat||'').replace(/_meta$/,''); const col=(baseSubcat&&C[baseSubcat])?C[baseSubcat]:(def.subcat&&C[def.subcat])?C[def.subcat]:C[def.cat]||C.meta;
  const [slotOver,setSlotOver]=useState({});

  const wasDragging=useRef(false);

  const isHat=def.cat==="origin";
  const isHovered=hoveredId===id;
  const isSelected=selectedId===id;
  const fieldRows=def.fields.length;
  // Header stripe is 34px. Fields sit below with BPH padding top+bottom, FH per row, 2px gap between rows.
  const fieldsH = fieldRows > 0 ? BPH*2 + fieldRows*FH + (fieldRows-1)*2 : BPH;
  const bodyH = (isChild&&!isSibling?NI:0) + 34 + (b.collapsed?0:fieldsH);

  // slot rendering helpers
  // Track global child index across all slots (reset each render)
  let globalChildIndex=0;
  function renderSlot(slot,si){
    const childIds=b.children[slot.key]||[];
    const slotId=`${id}||${slot.key}`;
    const isOver=slotOver[si]||(mouseOverSlot===slotId);
    const showZone=slot.multi||childIds.length===0;
    // Pick slot color based on the slot key (more specific than accepts[0])
    const slotColorKey=(()=>{
      const k=slot.key;
      if(k.startsWith("bientity"))return"bientity";
      if(k.startsWith("block"))return"block";
      if(k.startsWith("item"))return"item";
      if(k.startsWith("damage"))return"damage";
      if(k==="entity_action"||k==="action"||k.endsWith("_action"))return"entity";
      if(k==="entity_condition"||k==="condition"||k.endsWith("_condition"))return"entity";
      if(k==="landing_condition"||k==="landing_block_condition")return"block";
      return slot.accepts[0]||"meta";
    })();
    const slotCol=C[slotColorKey]||C[slot.accepts[0]]||C.meta;

    function onDragOverSlot(e){e.preventDefault();e.stopPropagation();setSlotOver(s=>({...s,[si]:true}));}
    function onDragLeaveSlot(e){e.stopPropagation();setSlotOver(s=>({...s,[si]:false}));}
    function onDropSlot(e){
      e.preventDefault();e.stopPropagation();
      setSlotOver(s=>({...s,[si]:false}));
      const bname=e.dataTransfer.getData("palette");
      const dragId=e.dataTransfer.getData("blockId");
      if(bname&&DEFS[bname]&&slot.accepts.includes(DEFS[bname].cat)){
        dispatch({t:"ADD_CHILD",parentId:id,slotKey:slot.key,bname});
      } else if(dragId){
        const did=parseInt(dragId);
        const db=bmap[did];
        if(db&&did!==id&&slot.accepts.includes(DEFS[db.bname].cat)){
          const wasRoot=e.dataTransfer.getData("isRoot")==="1";
          dispatch({t:"ATTACH",parentId:id,slotKey:slot.key,childId:did,wasRoot});
        }
      }
    }

    return h("div",{key:slot.key,style:{marginLeft:0,position:"relative",marginBottom:8}},
      // slot label — only show when this slot is empty
      childIds.length===0&&h("div",{style:{fontSize:9,color:slotCol.light+"cc",fontWeight:600,letterSpacing:"0.05em",
        fontFamily:"'Segoe UI',sans-serif",marginBottom:3,paddingLeft:2,textTransform:"uppercase"}},
        slot.label),
      // children stacked
      childIds.map((cid,ci)=>{const isFirstOverall=globalChildIndex++===0;return h(ScratchBlock,{key:cid,id:cid,bmap,isChild:isFirstOverall,isSibling:!isFirstOverall,depth:depth+1,dispatch,hoveredId,selectedId,setHoveredId,setSelectedId,mouseOverSlot});}),
      // extra children auto-wrap hint for single slots
      !slot.multi&&childIds.length>1&&h("div",{style:{fontSize:9,color:slotCol.light,background:slotCol.dark+"88",borderRadius:4,padding:"2px 8px",margin:"2px 0",fontFamily:"monospace"}},
        `⚡ ${childIds.length} blocks → auto-wrapped as apoli:and`),
      // drop zone
      showZone&&h("div",{
        "data-slot-id":`${id}||${slot.key}`,
        "data-accepts":slot.accepts.join(","),
        onDragOver:onDragOverSlot,onDragLeave:onDragLeaveSlot,onDrop:onDropSlot,
        style:{
          height:isOver?40:32,minWidth:160,
          borderRadius:8,
          border:`2px dashed ${isOver?slotCol.light:slotCol.border+"88"}`,
          background:isOver?slotCol.bg+"30":slotCol.dark+"30",
          display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:10,color:isOver?slotCol.light:slotCol.border,
          fontFamily:"'Segoe UI',sans-serif",
          margin:"4px 0",padding:"0 12px",
          transition:"all 0.1s",cursor:"default",
          letterSpacing:"0.02em",
          boxShadow:isOver?`inset 0 0 0 1px ${slotCol.light}44`:"none",
        }
      }, h(Tooltip,{text:`JSON key: "${slot.key}"\nAccepts: ${slot.accepts.join(", ")}\n${slot.multi?"Multiple children allowed":"Single child only"}`,side:"top"},
        h("span",{style:{cursor:"help"}},childIds.length&&slot.multi?`＋ ${slot.accepts[0]}`:"⬇ "+slot.label)))
    );
  }

  const hasSlots=def.slots&&def.slots.length>0;
  const slotsContent=hasSlots&&!b.collapsed
    ? h("div",{style:{display:"flex",flexDirection:"column",gap:2}},
        def.slots.map((slot,si)=>renderSlot(slot,si)))
    : null;

  const bw=calcBW({...def,bname:b.bname});
  const svgH=bodyH;
  const totalSvgH=svgH+NH+2; // bodyH includes socket, + bump at bottom

  return h("div",{
    style:(isChild||isSibling)
      ? {position:"relative",marginBottom:0,marginTop:isChild?-NH-2:0,overflow:"visible",
         outline:isSelected?"2px solid #a78bfa":isHovered?"1.5px solid rgba(167,139,250,0.4)":"none",
         borderRadius:6}
      : {position:"absolute",left:b.x,top:b.y,zIndex:depth+1,
         outline:peerDragColor?`2px solid ${peerDragColor}`:isSelected?"2px solid #a78bfa":isHovered?"1.5px solid rgba(167,139,250,0.4)":"none",
         boxShadow:peerDragColor?`0 0 12px ${peerDragColor}66`:undefined,
         borderRadius:6},
    onMouseEnter:e=>{e.stopPropagation();setHoveredId&&setHoveredId(id);},
    onMouseLeave:e=>{e.stopPropagation();setHoveredId&&setHoveredId(p=>p===id?null:p);},
    onClick:e=>{e.stopPropagation();if(wasDragging.current){wasDragging.current=false;return;}setSelectedId&&setSelectedId(p=>p===id?null:id);},
  },
    // ── main block ──
    h("div",{
      draggable:isChild||isSibling,
      onMouseDown:e=>{
        if(e.button!==0)return;
        e.stopPropagation();
        e.preventDefault();
        wasDragging.current=false;
        if(isChild||isSibling){
          // Store pending detach — only execute if mouse actually moves
          window.__pendingDetach={id,mx:e.clientX,my:e.clientY};
        } else {
          const b2=bmap[id];
          dispatch({t:"DRAG_START",id,isRoot:true,e,bx:b2.x,by:b2.y,mx:e.clientX,my:e.clientY});
        }
      },
      onTouchStart:e=>{
        if(e.target.tagName==="BUTTON"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
        e.stopPropagation();
        const b2=bmap[id];
        window.__blockTouch&&window.__blockTouch(e,id,b2?b2.x:0,b2?b2.y:0);
      },
      onMouseMove:e=>{if(!isChild&&!isSibling)wasDragging.current=true;},
      onDragStart:e=>{
        if(!isChild&&!isSibling){e.preventDefault();return;}
        e.stopPropagation();
        e.dataTransfer.setData("blockId",String(id));
        e.dataTransfer.setData("isRoot","0");
        e.dataTransfer.effectAllowed="move";
      },
      style:{position:"relative",display:"block",cursor:"grab",userSelect:"none",
        overflow:"visible",
        filter:'drop-shadow(0 3px 8px rgba(0,0,0,0.55))'}
    },
      // SVG shape — translated down by NH for child (socket at top)
      h("svg",{
        width:bw+4,height:totalSvgH+2,
        style:{overflow:"visible",display:"block",pointerEvents:"none"}
      },
        h("g",{transform:`translate(2,1)`},
          h("path",{
            d:isHat?hatPath(bw,svgH):stackPath(bw,svgH,isChild),
            fill:col.bg,stroke:col.border,strokeWidth:"2"
          }),
          // darker header stripe using headerPath
          h("path",{
            d:headerPath(bw,isChild),
            fill:"rgba(0,0,0,0.22)"
          })
        )
      ),
      // ── header layer (absolutely on top of svg) ──
      h("div",{style:{
        position:"absolute",top:(isChild&&!isSibling)?NI+1:1,left:2,width:bw,height:34,
        display:"flex",alignItems:"center",paddingLeft:10,paddingRight:6,gap:6,
        pointerEvents:"all"
      }},
        // category badge
        h("div",{style:{
          background:"rgba(0,0,0,0.35)",borderRadius:10,
          padding:"2px 8px",fontSize:9,fontWeight:700,
          color:col.light,letterSpacing:"0.06em",flexShrink:0,fontFamily:"'Segoe UI',sans-serif"
        }},col.icon+" "+(def.subcat?def.subcat.replace(/_meta$/,"").toUpperCase()+" "+def.cat.toUpperCase():def.cat==="meta"?"META":def.cat.toUpperCase())),
        // block name
        h(Tooltip,{text:(def.pt||def.ct||def.at||"")+("\nDouble-click to rename"),side:"top"},
          h("span",{
            style:{fontSize:12,fontWeight:700,color:"#fff",letterSpacing:"0.01em",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontFamily:"'Segoe UI',sans-serif",cursor:"pointer"},
            onDblClick:e=>{
              e.stopPropagation();
              const newName=prompt("Rename block:",b.bname);
              if(newName&&newName.trim()&&newName.trim()!==b.bname){
                dispatch({t:"SET",id,key:"__rename",val:newName.trim()});
              }
            }
          }, b.bname)),
        // buttons
        isChild&&h("button",{
          title:"detach to canvas",
          onMouseDown:e=>e.stopPropagation(),
          onClick:e=>{e.stopPropagation();dispatch({t:"DETACH",id});},
          style:{width:20,height:20,borderRadius:10,background:"rgba(250,200,0,0.2)",border:"1px solid rgba(250,200,0,0.4)",cursor:"pointer",color:"#fcd34d",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}
        },"↑"),
        h("button",{
          title:b.collapsed?"expand":"collapse",
          onMouseDown:e=>e.stopPropagation(),
          onClick:e=>{e.stopPropagation();dispatch({t:"SET",id,key:"__collapse",val:!b.collapsed});},
          style:{width:20,height:20,borderRadius:10,background:"rgba(255,255,255,0.12)",border:"none",cursor:"pointer",color:"#fff",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}
        },b.collapsed?"▸":"▾"),
        h("button",{
          title:"delete",
          onMouseDown:e=>e.stopPropagation(),
          onClick:e=>{e.stopPropagation();dispatch({t:isChild?"REM_CHILD":"REM_ROOT",id});},
          style:{width:20,height:20,borderRadius:10,background:"rgba(220,30,30,0.4)",border:"none",cursor:"pointer",color:"#fff",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}
        },"×")
      ),
      // ── field inputs ──
      !b.collapsed&&def.fields.length>0&&h("div",{style:{
        position:"absolute",top:((isChild&&!isSibling)?NI:0)+36,left:2,width:bw,
        padding:`${BPH-2}px 10px`,display:"flex",flexDirection:"column",gap:2,pointerEvents:"all"
      }},
        def.fields.map(f=>h("div",{key:f.k,style:{display:"flex",alignItems:"center",minHeight:FH,height:FH,gap:6}},
          h(Tooltip,{
            text:`JSON key: "${f.k}"${f.d!==undefined?`\nDefault: ${f.d}`:""}${f.t==="tx"?"\nType: text/string":f.t==="sel"?"\nType: dropdown select":""}`,
            side:"top"
          },
            h("span",{style:{fontSize:10,color:"rgba(255,255,255,0.7)",minWidth:70,textAlign:"right",flexShrink:0,fontFamily:"'Segoe UI',sans-serif",cursor:"help",borderBottom:"1px dotted rgba(255,255,255,0.3)"}},f.l)
          ),
          f.t==="sel"
            ?h("select",{
                value:b.vals[f.k],
                onChange:e=>dispatch({t:"SET",id,key:f.k,val:e.target.value}),
                onMouseDown:e=>e.stopPropagation(),onClick:e=>e.stopPropagation(),
                title:`JSON key: "${f.k}" — select a value`,
                style:{flex:1,height:22,fontSize:10,background:col.dark,color:"#fff",border:`1.5px solid ${col.border}`,borderRadius:11,padding:"0 8px",cursor:"pointer",fontFamily:"'Segoe UI',sans-serif"}
              },f.o.map(o=>h("option",{key:o,value:o},o)))
            :h("input",{
                type:"text",value:b.vals[f.k],
                onChange:e=>dispatch({t:"SET",id,key:f.k,val:e.target.value}),
                onMouseDown:e=>e.stopPropagation(),onClick:e=>e.stopPropagation(),
                placeholder:f.d||"",
                title:`JSON key: "${f.k}"${f.d?` — e.g. ${f.d}`:""}`,
                style:{flex:1,height:22,fontSize:10,background:col.dark,color:"#fff",border:`1.5px solid ${col.border}`,borderRadius:11,padding:"0 10px",fontFamily:"'Segoe UI',sans-serif"}
              })
        ))
      ),
      // ── slots — Scratch-style C-block mouth ──
      !b.collapsed&&slotsContent&&h("div",{style:{
        marginLeft:4,
        paddingLeft:10,
        borderLeft:`3px solid ${col.border}`,
        borderBottomLeftRadius:6,
        paddingBottom:4,
      }},slotsContent)
    )
  );
}

function PalBlock({bname}){
  const def=DEFS[bname],baseSubcat=(def.subcat||'').replace(/_meta$/,''),col=(baseSubcat&&C[baseSubcat])?C[baseSubcat]:(def.subcat&&C[def.subcat])?C[def.subcat]:C[def.cat]||C.meta;
  return h("div",{
    className:"flyout-block",
    draggable:true,
    onDragStart:e=>{e.dataTransfer.setData("palette",bname);e.dataTransfer.setData("isRoot","0");},
    onTouchStart:e=>window.__palTouch&&window.__palTouch(e,bname),
    title:def.pt||def.ct||def.at||"",
    style:{
      background:`linear-gradient(135deg,${col.bg},${col.dark})`,
      border:`1.5px solid ${col.border}`,
      borderRadius:8,
      padding:"6px 10px",
      marginBottom:4,
      cursor:"grab",
      userSelect:"none",
      display:"flex",
      alignItems:"center",
      gap:6,
      boxShadow:`0 2px 6px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.08)`,
    }
  },
    h("span",{style:{fontSize:9,color:col.light,fontWeight:700,letterSpacing:"0.05em",fontFamily:"'Segoe UI',sans-serif",flexShrink:0}},col.icon),
    h("span",{style:{fontSize:11,color:"#fff",fontWeight:600,fontFamily:"'Segoe UI',sans-serif",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},bname)
  );
}

// ═══════════════════════════════════════════════════════════════
// STATE REDUCER
// ═══════════════════════════════════════════════════════════════
let _uid=1;
function mkB(bname,x=100,y=100){
  const def=DEFS[bname],vals={};
  def.fields.forEach(f=>{vals[f.k]=f.d;});
  return{id:_uid++,bname,x,y,vals,children:{},collapsed:false};
}
function findPar(id,bmap,roots){
  function search(fromId){
    const b=bmap[fromId]; if(!b)return null;
    for(const[sk,ids]of Object.entries(b.children||{})){
      if(ids.includes(id))return{parentId:fromId,slotKey:sk};
      for(const cid of ids){const r=search(cid);if(r)return r;}
    }
    return null;
  }
  for(const rid of roots){const r=search(rid);if(r)return r;}
  return null;
}
function delTree(id,bmap){
  const b=bmap[id]; if(!b)return;
  Object.values(b.children||{}).flat().forEach(cid=>delTree(cid,bmap));
  delete bmap[id];
}

function reducer(state,a){
  const bmap={...state.bmap};
  let roots=[...state.roots];
  switch(a.t){
    case"DRAG_CANCEL":break; // handled by dragRef.current=null in onMouseUp
    case"ADD_ROOT":{const b=mkB(a.bname,a.x,a.y);bmap[b.id]=b;roots=[...roots,b.id];break;}
    case"MOVE_ROOT":{bmap[a.id]={...bmap[a.id],x:a.x,y:a.y};break;}
    case"REM_ROOT":{delTree(a.id,bmap);roots=roots.filter(x=>x!==a.id);break;}
    case"SET":{
      const b={...bmap[a.id]};
      if(a.key==="__collapse")b.collapsed=a.val;
      else if(a.key==="__rename")b.bname=a.val;
      else b.vals={...b.vals,[a.key]:a.val};
      bmap[a.id]=b;break;
    }
    case"ADD_CHILD":{
      const child=mkB(a.bname);bmap[child.id]=child;
      const par={...bmap[a.parentId]};
      par.children={...par.children,[a.slotKey]:[...(par.children[a.slotKey]||[]),child.id]};
      bmap[par.id]=par;break;
    }
    case"ATTACH":{
      if(a.wasRoot)roots=roots.filter(x=>x!==a.childId);
      else{
        const op=findPar(a.childId,bmap,roots);
        if(op){const p={...bmap[op.parentId]};p.children={...p.children,[op.slotKey]:p.children[op.slotKey].filter(x=>x!==a.childId)};bmap[p.id]=p;}
      }
      const par={...bmap[a.parentId]};
      par.children={...par.children,[a.slotKey]:[...(par.children[a.slotKey]||[]),a.childId]};
      bmap[par.id]=par;break;
    }
    case"REM_CHILD":{
      const op=findPar(a.id,bmap,roots);
      if(op){const p={...bmap[op.parentId]};p.children={...p.children,[op.slotKey]:p.children[op.slotKey].filter(x=>x!==a.id)};bmap[p.id]=p;}
      if(a.becomeRoot){const b={...bmap[a.id],x:a.x||100,y:a.y||100};bmap[b.id]=b;roots=[...roots,b.id];}
      else delTree(a.id,bmap);break;
    }
    case"DETACH":{
      const op=findPar(a.id,bmap,roots);
      if(!op)break;
      const p={...bmap[op.parentId]};p.children={...p.children,[op.slotKey]:p.children[op.slotKey].filter(x=>x!==a.id)};bmap[p.id]=p;
      bmap[a.id]={...bmap[a.id],x:a.x||80,y:a.y||80};
      roots=[...roots,a.id];break;
    }
    case"PASTE_TREE":{
      function buildTree(tree){
        const nb=mkB(tree.bname);
        nb.vals={...tree.vals};
        Object.entries(tree.children||{}).forEach(([sk,ctrees])=>{
          nb.children[sk]=ctrees.map(ct=>{
            const cb=buildTree(ct);
            bmap[cb.id]=cb;
            return cb.id;
          });
        });
        return nb;
      }
      const pasted=buildTree(a.tree);
      pasted.x=a.x; pasted.y=a.y;
      bmap[pasted.id]=pasted;
      roots=[...roots,pasted.id];
      break;
    }
    case"CLONE_ROOT":{
      // deep clone a block tree, assign new ids, place at offset position
      function cloneTree(id,newBmap){
        const b=bmap[id]||newBmap[id]; if(!b)return null;
        const nb={...b,id:++idCounter,x:b.x+40,y:b.y+40,children:{}};
        Object.entries(b.children||{}).forEach(([sk,cids])=>{
          nb.children[sk]=cids.map(cid=>cloneTree(cid,newBmap)).filter(Boolean);
        });
        newBmap[nb.id]=nb;
        return nb.id;
      }
      const newBmap={...bmap};
      const newId=cloneTree(a.srcId,newBmap);
      if(newId!=null){
        const nb=newBmap[newId];
        nb.x=a.x; nb.y=a.y;
        newBmap[newId]=nb;
        Object.assign(bmap,newBmap);
        roots=[...roots,newId];
      }
      Object.assign(bmap,newBmap);
      break;
    }
    case"RESTORE":{
      Object.keys(bmap).forEach(k=>delete bmap[k]);
      Object.assign(bmap,a.snapshot.bmap);
      roots=a.snapshot.roots;
      break;
    }
    case"IMPORT_JSON":{
      // Parse JSON object into blocks recursively
      function findDef2(type, slotKey){
        // slotKey tells us if we want an action type (at) or condition type (ct) or power (pt)
        const all = Object.entries(DEFS).filter(([name,def])=>def.pt===type||def.ct===type||def.at===type);
        if(all.length === 0) return null;
        if(all.length === 1) return all[0];
        // Use slot key to disambiguate action vs condition
        const wantAction = slotKey==='actions'||slotKey==='action'||slotKey==='entity_action'||slotKey==='bientity_action'||slotKey==='if_action'||slotKey==='else_action';
        const wantCondition = slotKey==='conditions'||slotKey==='condition'||slotKey==='bientity_condition'||slotKey==='entity_condition';
        if(wantAction){
          const act = all.find(([n,d])=>d.at===type);
          if(act) return act;
        }
        if(wantCondition){
          const cond = all.find(([n,d])=>d.ct===type);
          if(cond) return cond;
        }
        // Power type or unknown — prefer pt match, then at, then ct
        return all.find(([n,d])=>d.pt===type)||all.find(([n,d])=>d.at===type)||all[0];
      }
      function parseBlock2(obj,px,py,slotKey){
        if(!obj||typeof obj!=='object'||!obj.type)return null;
        const found=findDef2(obj.type,slotKey);
        if(!found)return null;
        const [bname,def]=found;
        const b=mkB(bname);
        b.x=px; b.y=py;
        // Fill fields
        def.fields.forEach(f=>{
          if(f.k==='name'&&obj.name!==undefined){b.vals.name=String(obj.name);return;}
          if(obj[f.k]!==undefined&&typeof obj[f.k]!=='object')b.vals[f.k]=String(obj[f.k]);
        });
        // apply_effect special case
        if(obj.type==='origins:apply_effect'&&obj.effect&&typeof obj.effect==='object'){
          if(obj.effect.effect)b.vals.effect_id=obj.effect.effect;
          if(obj.effect.duration!==undefined)b.vals.effect_duration=String(obj.effect.duration);
          if(obj.effect.amplifier!==undefined)b.vals.effect_amplifier=String(obj.effect.amplifier);
        }
        // damage source special case
        if(obj.type==='origins:damage'&&obj.source&&typeof obj.source==='object'){
          b.vals.source=obj.source.name||'';
          if(obj.source.bypasses_armor)b.vals.bypasses_armor='true';
          if(obj.source.fire)b.vals.fire='true';
        }
        // Multiple power sub-keys
        if(def.isMultiple){
          Object.entries(obj).forEach(([k,v])=>{
            if(k==='type'||k==='name')return;
            if(typeof v==='object'&&v!==null&&v.type){
              const cid=parseBlock2(v,px+40,py+40,"subpowers");
              if(cid){bmap[cid].vals.name=k;if(!b.children.subpowers)b.children.subpowers=[];b.children.subpowers.push(cid);}
            }
          });
        }
        // Slots
        (def.slots||[]).forEach(slot=>{
          const val=obj[slot.key];
          if(!val)return;
          if(slot.multi&&Array.isArray(val)){
            val.forEach(child=>{
              if(typeof child==='object'&&child.type){
                const cid=parseBlock2(child,px+40,py+40,slot.key);
                if(cid){if(!b.children[slot.key])b.children[slot.key]=[];b.children[slot.key].push(cid);}
              }
            });
          } else if(typeof val==='object'&&val!==null&&val.type){
            const cid=parseBlock2(val,px+40,py+40,slot.key);
            if(cid)b.children[slot.key]=[cid];
          }
        });
        bmap[b.id]=b;
        // Only the top-level call adds to roots — children are referenced via parent.children
        return b.id;
      }
      const rootId=parseBlock2(a.json,a.x||100,a.y||100);
      if(rootId) roots=[...roots,rootId];
      break;
    }
    default:break;
  }
  return{bmap,roots};
}
