// APP
// ═══════════════════════════════════════════════════════════════
function App(){
  const [{bmap,roots},rawDispatch]=useReducer(reducer,{bmap:{},roots:[]});
  const historyRef=useRef({past:[],future:[]});
  const [tab,setTab]=useState("editor");
  const [activeCat,setActiveCat]=useState(null);  // which category flyout is open
  const [search,setSearch]=useState("");
  const [copied,setCopied]=useState(false);
  const [showImport,setShowImport]=useState(false);
  const [importText,setImportText]=useState("");
  const [zoom,setZoom]=useState(1.0);
  const MIN_ZOOM=0.25, MAX_ZOOM=2.0, ZOOM_STEP=0.1;
  const [collab,setCollab]=useState({active:false,isHost:false,roomCode:'',peers:[],status:'',nickname:''});
  const collabRef=useRef({peer:null,conns:[]});
  const [remoteCursors,setRemoteCursors]=useState({});   // {connId:{x,y,nickname,color}}

  const [trashHover,setTrashHover]=useState(false);
  const [selectedId,setSelectedId]=useState(null);   // block selected for copy (Ctrl+C)
  const [clipboard,setClipboard]=useState(null);      // copied block tree {bname, vals, children subtree}
  const [hoveredId,setHoveredId]=useState(null);
  const canvasRef=useRef(null);
  const panRef=useRef({active:false,startX:0,startY:0,tx:0,ty:0});
  const editingPowerId=useRef(null);
  const [remoteDrags,setRemoteDrags]=useState({});
  const [chatUnread,setChatUnread]=useState(0); // {peerId:{id,x,y}} // set by manager when opening a power
  const [pan,setPan]=useState({x:0,y:0});
  const dragRef=useRef(null);
  const touchRef=useRef(null);
  const cursorPos=useRef({x:200,y:200});              // last known canvas cursor position
  const [mouseOverSlot,setMouseOverSlotApp]=useState(null);
  window.__setMouseOverSlot=(sid)=>setMouseOverSlotApp(sid);

  // wrap dispatch to intercept DRAG_START/CANCEL and save undo history
  function dispatch(a){
    if(a.t==="DRAG_CANCEL"){dragRef.current=null;return;}
    if(a.t==="DRAG_START"){
      if(a.isRoot) dragRef.current={id:a.id,mx:a.mx,my:a.my,bx:a.bx,by:a.by,active:true};
      return;
    }
    const skipUndo=a.t==="MOVE_ROOT"||a.t==="SET";
    if(!skipUndo){
      historyRef.current.past.push(JSON.stringify({bmap,roots}));
      historyRef.current.future=[];
      if(historyRef.current.past.length>50) historyRef.current.past.shift();
    }
    rawDispatch(a);
    // Broadcast structural changes to peers (not drag/move)
    if(!window.__applyingPeerAction && a.t!=='MOVE_ROOT'){
      window.parent.postMessage({type:'EDITOR_ACTION',action:a,powerId:editingPowerId.current},'*');
    }
  }

  function onCanvasDrop(e){
    e.preventDefault();setTrashHover(false);
    const rect=canvasRef.current.getBoundingClientRect();
    const x=(e.clientX-rect.left-pan.x)/zoom-20;
    const y=(e.clientY-rect.top-pan.y)/zoom-20;
    const bname=e.dataTransfer.getData("palette");
    if(bname&&DEFS[bname]){
      dispatch({t:"ADD_ROOT",bname,x,y});
      setActiveCat(null);
    }
  }

  function onCanvasMouseMove(e){
    // Pan with middle mouse
    if(panRef.current.active){
      const nx=panRef.current.tx+(e.clientX-panRef.current.startX);
      const ny=panRef.current.ty+(e.clientY-panRef.current.startY);
      setPan({x:nx,y:ny});
    }

    // Broadcast cursor to collab peers
    if(collab.active&&(!collabRef.current._lastCursor||Date.now()-collabRef.current._lastCursor>50)){
      collabRef.current._lastCursor=Date.now();
      if(canvasRef.current){
        const r=canvasRef.current.getBoundingClientRect();
        const x=Math.round((e.clientX-r.left-pan.x)/zoom);
        const y=Math.round((e.clientY-r.top-pan.y)/zoom);
        collabRef.current.conns.forEach(conn=>{try{conn.send({type:'CURSOR',x,y,nickname:collab.nickname||'Host'});}catch(e){}});
      }
    }

    // track cursor position relative to canvas
    if(canvasRef.current){
      const r=canvasRef.current.getBoundingClientRect();
      cursorPos.current={x:e.clientX-r.left, y:e.clientY-r.top};
    }

    const dr=dragRef.current;
    if(!dr||!dr.active)return;
    const nx=dr.bx+(e.clientX-dr.mx)/zoom;
    const ny=dr.by+(e.clientY-dr.my)/zoom;
    dr.lastX=nx; dr.lastY=ny;

    rawDispatch({t:"MOVE_ROOT",id:dr.id,x:nx,y:ny});
    // Broadcast drag position to peers (throttled 30ms)
    if(!window.__applyingPeerAction){
      const now=Date.now();
      if(!dr._lastBroadcast||now-dr._lastBroadcast>60){
        dr._lastBroadcast=now;
        window.parent.postMessage({type:'EDITOR_DRAG_MOVE',id:dr.id,x:nx,y:ny,
          powerId:editingPowerId.current},'*');
      }
    }
    let foundSlot=null;
    document.querySelectorAll('[data-slot-id]').forEach(el=>{
      const r=el.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) foundSlot=el.dataset.slotId;
    });
    window.__setMouseOverSlot&&window.__setMouseOverSlot(foundSlot);
  }

  function onCanvasMouseUp(e){
    // End pan
    if(e.button===1){
      panRef.current.active=false;
      if(canvasRef.current) canvasRef.current.style.cursor='';
      return;
    }
    window.__setMouseOverSlot&&window.__setMouseOverSlot(null);
    const dr=dragRef.current;
    if(dr){
      const els=document.elementsFromPoint(e.clientX,e.clientY);
      for(const el of els){
        const sid=el.dataset&&el.dataset.slotId;
        if(sid){
          const [pid,sk]=sid.split("||");
          const parentId=parseInt(pid);
          const accepts=(el.dataset.accepts||"").split(",");
          const b=bmap[dr.id];
          if(b&&accepts.includes(DEFS[b.bname].cat)){
            dispatch({t:"ATTACH",parentId,slotKey:sk,childId:dr.id,wasRoot:true});
          }
          break;
        }
      }
    }
    // Send final position to peers on drag end
    if(!window.__applyingPeerAction && dragRef.current) {
      const finalId = dragRef.current.id;
      const finalX = dragRef.current.lastX ?? bmap[finalId]?.x;
      const finalY = dragRef.current.lastY ?? bmap[finalId]?.y;
      if(finalX != null && finalY != null) {
        window.parent.postMessage({type:'EDITOR_DRAG_END',id:finalId,x:finalX,y:finalY,
          powerId:editingPowerId.current},'*');
      }
    }
    dragRef.current=null;
    window.__pendingDetach=null;
  }

  // ── Touch support ───────────────────────────────────────────────────────
  function createGhost(label,col){
    const g=document.createElement("div");
    g.style.cssText=`position:fixed;z-index:99999;pointer-events:none;opacity:0.85;
      background:${col||"#3a3a5c"};color:#fff;padding:6px 14px;border-radius:10px;
      font-size:12px;font-weight:700;font-family:'Segoe UI',sans-serif;
      box-shadow:0 4px 16px rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.2);
      white-space:nowrap;transform:translate(-50%,-50%);transition:none;`;
    g.textContent=label;
    document.body.appendChild(g);
    return g;
  }

  function moveGhost(ghost,x,y){
    if(ghost){ghost.style.left=x+"px";ghost.style.top=y+"px";}
  }

  function removeGhost(ghost){
    if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
  }

  function getSlotUnderTouch(x,y){
    // find the slot drop zone div under a touch point
    const els=document.elementsFromPoint(x,y);
    for(const el of els){
      const sid=el.dataset&&el.dataset.slotId;
      if(sid){
        const [pid,sk]=sid.split("||");
        return {parentId:parseInt(pid),slotKey:sk,el,accepts:(el.dataset.accepts||"").split(",")};
      }
    }
    return null;
  }

  function onPalTouchStart(e,bname){
    e.preventDefault();
    const t=e.touches[0];
    const def=DEFS[bname];
    const col=((def.subcat&&C[def.subcat.replace(/_meta$/,"")])||C[def.cat]||C.meta).bg;
    const ghost=createGhost(bname,col);
    moveGhost(ghost,t.clientX,t.clientY);
    touchRef.current={type:"palette",bname,ghost};
  }

  function onBlockTouchStart(e,id,bx,by){
    if(e.target.tagName==="BUTTON"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
    e.preventDefault();
    const t=e.touches[0];
    const b=bmap[id];
    const col=((b&&DEFS[b.bname])?((DEFS[b.bname].subcat&&C[DEFS[b.bname].subcat.replace(/_meta$/,"")])||C[DEFS[b.bname].cat]||C.meta).bg:"#3a3a5c");
    const ghost=createGhost(b?b.bname:"block",col);
    moveGhost(ghost,t.clientX,t.clientY);
    const wasRoot=roots.includes(id);
    touchRef.current={type:"block",id,ghost,bx,by,startX:t.clientX,startY:t.clientY,wasRoot};
  }

  function onTouchMove(e){
    e.preventDefault();
    const tr=touchRef.current; if(!tr)return;
    const t=e.touches[0];
    moveGhost(tr.ghost,t.clientX,t.clientY);
    // also move root block live
    if(tr.type==="block"&&tr.wasRoot&&canvasRef.current){
      const r=canvasRef.current.getBoundingClientRect();
      const nx=tr.bx+(t.clientX-tr.startX);
      const ny=tr.by+(t.clientY-tr.startY);
      rawDispatch({t:"MOVE_ROOT",id:tr.id,x:nx,y:ny});
    }
  }

  function onTouchEnd(e){
    const tr=touchRef.current; if(!tr){return;}
    const t=e.changedTouches[0];
    removeGhost(tr.ghost);
    touchRef.current=null;

    const slot=getSlotUnderTouch(t.clientX,t.clientY);

    if(tr.type==="palette"){
      if(slot&&slot.accepts.includes(DEFS[tr.bname].cat)){
        // drop into slot
        dispatch({t:"ADD_CHILD",parentId:slot.parentId,slotKey:slot.slotKey,bname:tr.bname});
      } else if(canvasRef.current){
        // drop onto canvas
        const r=canvasRef.current.getBoundingClientRect();
        if(t.clientX>r.left&&t.clientX<r.right&&t.clientY>r.top&&t.clientY<r.bottom){
          const x=Math.max(8,t.clientX-r.left-20);
          const y=Math.max(8,t.clientY-r.top-20);
          dispatch({t:"ADD_ROOT",bname:tr.bname,x,y});
          setActiveCat(null);
        }
      }
    } else if(tr.type==="block"){
      if(slot&&slot.accepts.includes(DEFS[bmap[tr.id]?.bname]?.cat)){
        dispatch({t:"ATTACH",parentId:slot.parentId,slotKey:slot.slotKey,childId:tr.id,wasRoot:tr.wasRoot});
      }
      // if no slot, root block already moved live — nothing else needed
    }
  }

  // ── Keyboard shortcuts ──────────────────────────────────────────────────
  useEffect(()=>{
    function onKey(e){
      const tag=document.activeElement?.tagName;
      const inInput=tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA";

      // Ctrl+Z undo
      if((e.ctrlKey||e.metaKey)&&e.key==="z"&&!e.shiftKey&&!inInput){
        e.preventDefault();
        const past=historyRef.current.past;
        if(past.length===0)return;
        const snapshot=JSON.parse(past.pop());
        historyRef.current.future.push(JSON.stringify({bmap,roots}));
        rawDispatch({t:"RESTORE",snapshot});
        return;
      }
      // Ctrl+= zoom in, Ctrl+- zoom out, Ctrl+0 reset (keep keyboard shortcuts)
      if((e.ctrlKey||e.metaKey)&&(e.key==="="||e.key==="+")){
        e.preventDefault();
        const el=canvasRef.current;
        if(el){const cx=el.clientWidth/2,cy=el.clientHeight/2;
          setZoom(z=>{const nz=Math.min(MAX_ZOOM,parseFloat((z+ZOOM_STEP).toFixed(2)));
            setPan(p=>({x:cx-(cx-p.x)*nz/z,y:cy-(cy-p.y)*nz/z}));return nz;});}
        return;
      }
      if((e.ctrlKey||e.metaKey)&&e.key==="-"){
        e.preventDefault();
        const el=canvasRef.current;
        if(el){const cx=el.clientWidth/2,cy=el.clientHeight/2;
          setZoom(z=>{const nz=Math.max(MIN_ZOOM,parseFloat((z-ZOOM_STEP).toFixed(2)));
            setPan(p=>({x:cx-(cx-p.x)*nz/z,y:cy-(cy-p.y)*nz/z}));return nz;});}
        return;
      }
      if((e.ctrlKey||e.metaKey)&&e.key==="0"){
        e.preventDefault();
        setZoom(1.0);setPan({x:0,y:0});
        return;
      }

      // Ctrl+Y / Ctrl+Shift+Z redo
      if((e.ctrlKey||e.metaKey)&&(e.key==="y"||(e.key==="z"&&e.shiftKey))&&!inInput){
        e.preventDefault();
        const future=historyRef.current.future;
        if(future.length===0)return;
        const snapshot=JSON.parse(future.pop());
        historyRef.current.past.push(JSON.stringify({bmap,roots}));
        rawDispatch({t:"RESTORE",snapshot});
        return;
      }

      // Delete key — delete selected or hovered block
      if(e.key==="Delete"&&!inInput){
        const hid=selectedId||hoveredId;
        if(hid==null)return;
        e.preventDefault();
        if(roots.includes(hid)){
          dispatch({t:"REM_ROOT",id:hid});
        } else {
          dispatch({t:"REM_CHILD",id:hid});
        }
        setHoveredId(null);
        setSelectedId(null);
      }

      // Ctrl+C — copy selected/hovered block
      if((e.ctrlKey||e.metaKey)&&e.key==="c"&&!inInput){
        const cid=selectedId||hoveredId;
        if(cid==null||!bmap[cid])return;
        e.preventDefault();
        // deep-copy the block tree into clipboard state
        function copyTree(id){
          const b=bmap[id]; if(!b)return null;
          const copy={bname:b.bname,vals:{...b.vals},children:{}};
          Object.entries(b.children||{}).forEach(([sk,cids])=>{
            copy.children[sk]=cids.map(copyTree).filter(Boolean);
          });
          return copy;
        }
        setClipboard(copyTree(cid));
        setSelectedId(cid);
      }

      // Ctrl+V — paste clipboard at cursor
      if((e.ctrlKey||e.metaKey)&&e.key==="v"&&!inInput){
        if(!clipboard)return;
        e.preventDefault();
        const {x,y}=cursorPos.current;
        // deep paste: dispatch a special action that rebuilds the full tree
        dispatch({t:"PASTE_TREE",tree:clipboard,x:x-20,y:y-20});
      }
    }
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[hoveredId,selectedId,clipboard,roots,bmap]);

  // Reload page when settings are updated externally
  useEffect(()=>{
    function onStorage(e){
      if(e.key==='origins-settings-updated') window.location.reload();
    }
    window.addEventListener('storage',onStorage);
    return()=>window.removeEventListener('storage',onStorage);
  },[]);

  useEffect(()=>{
    function onWindowMouseMove(e){
      try{
      // Handle pending detach globally (child block drag-out)
      if(window.__pendingDetach){
        const pd=window.__pendingDetach;
        const dx=e.clientX-pd.mx, dy=e.clientY-pd.my;
        if(Math.sqrt(dx*dx+dy*dy)>4){
          window.__pendingDetach=null;
          const canvasEl=document.querySelector('.canvas-area');
          let ex=100,ey=100;
          if(canvasEl){const cr=canvasEl.getBoundingClientRect();ex=Math.max(0,pd.mx-cr.left-20);ey=Math.max(0,pd.my-cr.top-20);}
          dispatch({t:"DETACH",id:pd.id,x:ex,y:ey});
          dragRef.current={id:pd.id,mx:pd.mx,my:pd.my,bx:ex,by:ey,active:true};
        }
      }
      }catch(err){console.error("pendingDetach error:",err,err.stack);}
    }
    function onWindowMouseUp(){
      if(window.__pendingDetach) window.__pendingDetach=null;
    }
    window.addEventListener("mousemove",onWindowMouseMove);
    window.addEventListener("mouseup",onWindowMouseUp);
    window.addEventListener("touchmove",onTouchMove,{passive:false});
    window.addEventListener("touchend",onTouchEnd,{passive:false});
    return()=>{
      window.removeEventListener("mousemove",onWindowMouseMove);
      window.removeEventListener("mouseup",onWindowMouseUp);
      window.removeEventListener("touchmove",onTouchMove);
      window.removeEventListener("touchend",onTouchEnd);
    };
  });

  window.__palTouch=onPalTouchStart;
  window.__blockTouch=onBlockTouchStart;

  // ── JSON → Blocks parser ────────────────────────────────────────────────
  function j2b(json, dispatch, bmap, roots){
    // Parse a JSON object into blocks and add to canvas
    // Returns the root block id or null
    try {
      const obj = typeof json === 'string' ? JSON.parse(json) : json;
      const id = parseBlock(obj, dispatch);
      return id;
    } catch(e) {
      console.error('JSON parse error:', e);
      return null;
    }

    function findDef(type){
      // Find DEFS entry by pt, ct, or at matching type
      return Object.entries(DEFS).find(([name, def]) =>
        def.pt === type || def.ct === type || def.at === type
      );
    }

    function parseBlock(obj, dispatch, x=100, y=100){
      if(!obj || typeof obj !== 'object') return null;
      const type = obj.type;
      if(!type) return null;

      const found = findDef(type);
      if(!found) {
        console.warn('Unknown block type:', type);
        return null;
      }
      const [bname, def] = found;

      // Create block
      const b = mkB(bname);
      b.x = x; b.y = y;

      // Fill field values
      def.fields.forEach(f => {
        const key = f.k;
        if(key === 'name' && obj.name !== undefined) { b.vals.name = String(obj.name); return; }
        if(obj[key] !== undefined && typeof obj[key] !== 'object') {
          b.vals[key] = String(obj[key]);
        }
      });

      // Special case: apply_effect nested object
      if(type === 'origins:apply_effect' && obj.effect && typeof obj.effect === 'object'){
        if(obj.effect.effect) b.vals.effect_id = obj.effect.effect;
        if(obj.effect.duration !== undefined) b.vals.effect_duration = String(obj.effect.duration);
        if(obj.effect.amplifier !== undefined) b.vals.effect_amplifier = String(obj.effect.amplifier);
        if(obj.effect.is_ambient) b.vals.effect_is_ambient = 'true';
        if(obj.effect.show_particles === false) b.vals.effect_show_particles = 'false';
        if(obj.effect.show_icon === false) b.vals.effect_show_icon = 'false';
      }

      // Special case: stacking_status_effect
      if(type === 'origins:stacking_status_effect' && obj.effect && typeof obj.effect === 'object'){
        if(obj.effect.effect) b.vals.effect_id = obj.effect.effect;
        if(obj.effect.amplifier !== undefined) b.vals.effect_amplifier = String(obj.effect.amplifier);
      }

      // Special case: damage source
      if(type === 'origins:damage' && obj.source && typeof obj.source === 'object'){
        b.vals.source = obj.source.name || '';
        if(obj.source.bypasses_armor) b.vals.bypasses_armor = 'true';
        if(obj.source.fire) b.vals.fire = 'true';
        if(obj.source.projectile) b.vals.is_projectile = 'true';
        if(obj.source.magic) b.vals.is_magic = 'true';
        if(obj.source.unblockable) b.vals.unblockable = 'true';
      }

      // Special case: Multiple power — sub-power keys become named children
      if(def.isMultiple){
        const subSlot = def.slots?.find(s => s.key === 'subpowers');
        if(subSlot){
          Object.entries(obj).forEach(([k, v]) => {
            if(k === 'type' || k === 'name') return;
            if(typeof v === 'object' && v !== null && v.type){
              const childId = parseBlock(v, dispatch, x+40, y+40);
              if(childId){
                if(!b.children.subpowers) b.children.subpowers = [];
                // Set the sub-power name to its key
                bmap[childId].vals.name = k;
                b.children.subpowers.push(childId);
              }
            }
          });
        }
      }

      // Parse slots — match slot keys to obj keys
      (def.slots || []).forEach(slot => {
        const val = obj[slot.key];
        if(!val) return;

        if(slot.multi && Array.isArray(val)){
          // Multi-slot: array of child objects
          val.forEach(child => {
            if(typeof child === 'object' && child.type){
              const childId = parseBlock(child, dispatch, x+40, y+40);
              if(childId){
                if(!b.children[slot.key]) b.children[slot.key] = [];
                b.children[slot.key].push(childId);
              }
            }
          });
        } else if(typeof val === 'object' && val !== null && val.type){
          // Single slot: one child object
          const childId = parseBlock(val, dispatch, x+40, y+40);
          if(childId){
            b.children[slot.key] = [childId];
          }
        }
      });

      // Add block to bmap and roots
      bmap[b.id] = b;
      roots.push(b.id);
      return b.id;
    }
  }

  // ── Collaboration ────────────────────────────────────────────────────────
      function broadcastAction(action){
    collabRef.current.conns.forEach(conn=>{
      try{ conn.send({type:'ACTION',action}); }catch(e){}
    });
  }



        // ── postMessage bridge for file manager ───────────────────────────────
  useEffect(()=>{
    function onMessage(e){

      if(e.data?.type==="PEER_DRAG_MOVE"){
        if(dragRef.current&&dragRef.current.id===e.data.id) return;
        window.__applyingPeerAction=true;
        rawDispatch({t:"MOVE_ROOT",id:e.data.id,x:e.data.x,y:e.data.y});
        window.__applyingPeerAction=false;
        setRemoteDrags(d=>({...d,[e.data.peerId||'peer']:{id:e.data.id,color:e.data.color||'#7c5ce7'}}));
        return;
      }
      if(e.data?.type==="PEER_DRAG_END"){
        // Apply final position and clear marker
        window.__applyingPeerAction=true;
        rawDispatch({t:"MOVE_ROOT",id:e.data.id,x:e.data.x,y:e.data.y});
        window.__applyingPeerAction=false;
        setRemoteDrags(d=>{const n={...d};delete n[e.data.peerId||'peer'];return n;});
        return;
      }
      if(e.data?.type==="PEER_ACTION"){
        if(e.data.senderId&&e.data.senderId===window.__myPeerId) return;
        const a=e.data.action;
        if(a.t==="MOVE_ROOT"&&dragRef.current&&dragRef.current.id===a.id) return;
        window.__applyingPeerAction=true;
        rawDispatch(a);
        window.__applyingPeerAction=false;
        return;
      }
      if(e.data?.type==="REQUEST_CANVAS_STATE"){
        const state=JSON.stringify({bmap,roots});
        window.parent.postMessage({type:'CANVAS_STATE_RESPONSE',state,powerId:e.data.powerId},'*');
        return;
      }
      if(e.data?.type==="REQUEST_JSON"){
        const powerRoots=roots.filter(id=>bmap[id]&&DEFS[bmap[id].bname]?.cat==="power");
        if(powerRoots.length===0){window.parent.postMessage({type:"POWER_JSON",json:null,powerType:null,state:null},"*");return;}
        const f=genFiles(powerRoots,bmap);
        if(f.length===0){window.parent.postMessage({type:"POWER_JSON",json:null,powerType:null,state:null},"*");return;}
        const json=JSON.stringify(f[0].json,null,2);
        const powerType=f[0].json?.type||null;
        // Also send full editor state for reloading later
        const state=JSON.stringify({bmap,roots});
        window.parent.postMessage({type:"POWER_JSON",json,powerType,state},"*");
      }
      if(e.data?.type==="SET_PEER_ID"){
        window.__myPeerId=e.data.peerId;
        return;
      }
      if(e.data?.type==="CHAT_BADGE"){
        setChatUnread(e.data.unread||0);
        return;
      }

      if(e.data?.type==="LOAD_POWER"){
        if(e.data.powerId) editingPowerId.current=e.data.powerId;
        if(e.data.json){
          try{
            const snap=JSON.parse(e.data.json);
            if(snap&&snap.bmap&&snap.roots){
              rawDispatch({t:"RESTORE",snapshot:snap});
            }
          }catch(err){console.warn("Could not restore power state:",err);}
        } else {
          rawDispatch({t:"RESTORE",snapshot:{bmap:{},roots:[]}});
        }
      }
    }
    window.addEventListener("message",onMessage);
    return()=>window.removeEventListener("message",onMessage);
  },[roots,bmap]);

  const files=genFiles(roots,bmap);
  const jsonText=files.map(f=>`// ${f.name}\n${JSON.stringify(f.json,null,2)}`).join("\n\n---\n\n");

  // build flyout content
  const flyoutSections=activeCat==="search"
    ? [{label:`Search results`,keys:SECTIONS.flatMap(s=>s.keys).filter(k=>k.toLowerCase().includes(search.toLowerCase()))}]
    : activeCat
      ? SECTIONS.filter(s=>s.cat===activeCat||(activeCat==="meta"&&s.cat==="meta"))
      : search
        ? [{label:"Search results",keys:SECTIONS.flatMap(s=>s.keys).filter(k=>k.toLowerCase().includes(search.toLowerCase()))}]
        : [];

  const catGroups=[
    {id:"power",    col:C.power,    label:"Power"},
    {id:"condition",col:C.condition,label:"Cond."},
    {id:"action",   col:C.action,   label:"Action"},
    {id:"meta",     col:C.meta,     label:"Meta"},
  ];

  return h("div",{style:{display:"flex",flexDirection:"column",height:"100vh",background:"#1a1a2e"}},
    // ── TOPBAR ──────────────────────────────────────────────
    h("div",{style:{height:46,display:"flex",alignItems:"center",padding:"0 16px",background:"#12122a",borderBottom:"1px solid #ffffff10",gap:12,flexShrink:0,zIndex:200}},
      h("div",{style:{display:"flex",gap:5}},[["#ff5f57"],["#febc2e"],["#28c840"]].map(([c],i)=>h("div",{key:i,style:{width:12,height:12,borderRadius:"50%",background:c}}))),
      h("span",{style:{fontSize:12,fontWeight:700,color:"#4a4a7a",letterSpacing:"0.1em",marginLeft:6,fontFamily:"'Segoe UI',sans-serif"}},"ORIGINS BUILDER"),
      h("span",{style:{fontSize:11,color:S.accent+"88",marginLeft:8,cursor:"pointer",fontFamily:"'Segoe UI',sans-serif",textDecoration:"none"},onClick:()=>window.location.href="origins-guide.html"},"? Guide"),
      h("div",{style:{flex:1}}),
      h("div",{style:{display:"flex",gap:4}},
        ["editor","json"].map(t=>h("button",{key:t,onClick:()=>{setTab(t);setActiveCat(null);},
          style:{background:tab===t?"#2d2b52":"transparent",border:`1.5px solid ${tab===t?S.accent:"#ffffff15"}`,color:tab===t?S.accent+"cc":"#4a4a7a",borderRadius:8,padding:"4px 14px",fontSize:11,cursor:"pointer",fontFamily:"'Segoe UI',sans-serif",fontWeight:600}},
          t==="editor"?"✏ EDITOR":"{ } JSON"))
      ),
      h("button",{
        onClick:()=>{
          if(!jsonText){alert("No origin or power blocks on canvas to export.");return;}
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(jsonText)
              .then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1600);})
              .catch(()=>{
                // fallback: select a textarea
                const ta=document.createElement("textarea");
                ta.value=jsonText;ta.style.position="fixed";ta.style.opacity="0";
                document.body.appendChild(ta);ta.select();
                document.execCommand("copy");document.body.removeChild(ta);
                setCopied(true);setTimeout(()=>setCopied(false),1600);
              });
          } else {
            // no clipboard API — fallback
            const ta=document.createElement("textarea");
            ta.value=jsonText;ta.style.position="fixed";ta.style.opacity="0";
            document.body.appendChild(ta);ta.select();
            document.execCommand("copy");document.body.removeChild(ta);
            setCopied(true);setTimeout(()=>setCopied(false),1600);
          }
        },
        style:{background:copied?"#065f46":"#2d2b52",border:`1.5px solid ${copied?"#10b981":S.accent}`,color:copied?"#fff":S.accent+"cc",borderRadius:8,padding:"4px 14px",fontSize:11,cursor:jsonText?"pointer":"not-allowed",fontFamily:"'Segoe UI',sans-serif",fontWeight:600,transition:"all 0.2s",opacity:jsonText?1:0.4}
      },copied?"✓ COPIED":"⬇ COPY JSON"),
      h("button",{
        onClick:()=>setShowImport(v=>!v),
        style:{background:"#2d2b52",border:`1.5px solid ${S.accent}`,color:S.accent+"cc",borderRadius:8,padding:"4px 14px",fontSize:11,cursor:"pointer",fontFamily:"'Segoe UI',sans-serif",fontWeight:600}
      },"⬆ IMPORT JSON"),
      h("div",{style:{display:"flex",alignItems:"center",gap:4,background:"#1a1a2e",border:`1px solid ${S.accent}33`,borderRadius:8,padding:"2px 6px"}},
        h("button",{onClick:()=>{const el=canvasRef.current;if(el){const cx=el.clientWidth/2,cy=el.clientHeight/2;setZoom(z=>{const nz=Math.max(MIN_ZOOM,parseFloat((z-ZOOM_STEP).toFixed(2)));setPan(p=>({x:cx-(cx-p.x)*nz/z,y:cy-(cy-p.y)*nz/z}));return nz;});}},style:{background:"none",border:"none",color:S.accent+"cc",fontSize:14,cursor:"pointer",padding:"2px 4px",lineHeight:1}},"−"),
        h("span",{style:{fontSize:10,color:S.accent+"cc",fontFamily:"'JetBrains Mono',monospace",minWidth:36,textAlign:"center"}},Math.round(zoom*100)+"%"),
        h("button",{onClick:()=>{const el=canvasRef.current;if(el){const cx=el.clientWidth/2,cy=el.clientHeight/2;setZoom(z=>{const nz=Math.min(MAX_ZOOM,parseFloat((z+ZOOM_STEP).toFixed(2)));setPan(p=>({x:cx-(cx-p.x)*nz/z,y:cy-(cy-p.y)*nz/z}));return nz;});}},style:{background:"none",border:"none",color:S.accent+"cc",fontSize:14,cursor:"pointer",padding:"2px 4px",lineHeight:1}},"＋"),
        h("button",{onClick:()=>{setZoom(1.0);setPan({x:0,y:0});},title:"Reset zoom (Ctrl+0)",style:{background:"none",border:"none",color:S.accent+"55",fontSize:10,cursor:"pointer",padding:"2px 4px",lineHeight:1,fontFamily:"'Segoe UI',sans-serif"}},"⊙"),
      ),
      // Chat button (only when in collab session)
      collab.active&&h("div",{style:{position:"relative",marginLeft:8}},
        h("button",{
          onClick:()=>window.parent.postMessage({type:'OPEN_CHAT'},'*'),
          style:{background:"#2d2b52",border:`1.5px solid ${S.accent}`,color:S.accent+"cc",
            borderRadius:8,padding:"4px 12px",fontSize:11,cursor:"pointer",
            fontFamily:"'Segoe UI',sans-serif",fontWeight:600,position:"relative"}
        },
          "💬 Chat",
          chatUnread>0&&h("span",{style:{position:"absolute",top:-6,right:-6,
            background:"#ef4444",color:"#fff",borderRadius:"50%",
            width:16,height:16,fontSize:9,fontWeight:700,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontFamily:"'Segoe UI',sans-serif"}},chatUnread>9?"9+":chatUnread)
        )
      )
    ),

    // ── IMPORT MODAL ──────────────────────────────────────────
    showImport&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center"},
      onClick:e=>{if(e.target===e.currentTarget){setShowImport(false);setImportText("");}}},
      h("div",{style:{background:"#1a1a2e",border:"1px solid #ffffff15",borderRadius:12,padding:24,width:520,maxWidth:"90vw",display:"flex",flexDirection:"column",gap:12}},
        h("div",{style:{fontSize:14,fontWeight:700,color:"#fff",marginBottom:4}},"Import JSON → Blocks"),
        h("div",{style:{fontSize:11,color:"#64748b"}},"Paste a power, action, or condition JSON. Nested objects become child blocks automatically."),
        h("textarea",{
          value:importText,
          onChange:e=>setImportText(e.target.value),
          placeholder:'{\n  "type": "origins:active_self",\n  ...\n}',
          style:{width:"100%",height:220,background:"#0d0d1a",border:"1px solid #ffffff15",borderRadius:8,
            padding:12,color:"#e2e8f0",fontSize:12,fontFamily:"'JetBrains Mono',monospace",resize:"vertical",outline:"none"}
        }),
        h("div",{style:{display:"flex",gap:8,justifyContent:"flex-end"}},
          h("button",{
            style:{background:"transparent",border:"1px solid #ffffff20",color:"#94a3b8",borderRadius:8,padding:"8px 16px",fontSize:12,cursor:"pointer"},
            onClick:()=>{setShowImport(false);setImportText("");}
          },"Cancel"),
          h("button",{
            style:{background:S.accent,border:"none",color:"#fff",borderRadius:8,padding:"8px 16px",fontSize:12,fontWeight:600,cursor:"pointer"},
            onClick:()=>{
              try{
                historyRef.current.past.push(JSON.stringify({bmap,roots}));
                historyRef.current.future=[];
                const cleaned=importText.replace(/^\/\/.*$/mg,'').trim();
                const obj=JSON.parse(cleaned);
                const canvasEl=document.querySelector('.canvas-area');
                const cx=canvasEl?Math.round((canvasEl.clientWidth/2-pan.x)/zoom-150):200;
                const cy=canvasEl?Math.round((canvasEl.clientHeight/2-pan.y)/zoom-100):200;
                dispatch({t:"IMPORT_JSON",json:obj,x:cx,y:cy});
                setShowImport(false);
                setImportText("");
              }catch(e){alert("Invalid JSON: "+e.message);}
            }
          },"Import")
        )
      )
    ),

    // ── MAIN AREA ────────────────────────────────────────────
    h("div",{style:{display:"flex",flex:1,overflow:"hidden",minHeight:0,position:"relative",flexDirection:"row"}},

      // ── CATEGORY SIDEBAR (always visible) ──
      tab==="editor"&&h("div",{style:S.palettePos==="bottom"
        ? {position:"absolute",bottom:0,left:0,right:0,height:56,background:S.panelBg,borderTop:"1px solid #ffffff08",display:"flex",flexDirection:"row",alignItems:"center",paddingLeft:8,paddingRight:8,gap:4,zIndex:150,overflowX:"auto"}
        : {width:72,background:S.panelBg,borderRight:S.palettePos==="right"?"none":"1px solid #ffffff08",borderLeft:S.palettePos==="right"?"1px solid #ffffff08":"none",display:"flex",flexDirection:"column",alignItems:"center",paddingTop:12,gap:4,flexShrink:0,zIndex:150,order:S.palettePos==="right"?3:1}
      },
        // search box
        h("div",{style:S.palettePos==="bottom"?{marginRight:4,position:"relative"}:{width:52,marginBottom:8,position:"relative"}},
          h("input",{
            placeholder:"🔍",value:search,
            onChange:e=>{setSearch(e.target.value);if(e.target.value)setActiveCat("search");else setActiveCat(null);},
            onFocus:()=>search&&setActiveCat("search"),
            style:{width:S.palettePos==="bottom"?40:52,background:"#1e1e38",border:"1px solid #ffffff15",borderRadius:8,padding:"5px 6px",fontSize:10,color:"#fff",textAlign:"center",fontFamily:"'Segoe UI',sans-serif"}
          })
        ),
        catGroups.map(({id,col,label})=>h("div",{
          key:id,
          className:`cat-icon${activeCat===id?" active":""}`,
          style:{color:col.light,borderRightColor:activeCat===id?col.bg:"transparent"},
          onClick:()=>setActiveCat(activeCat===id?null:id)
        },
          h("div",{className:"cat-dot",style:{background:activeCat===id?col.bg:col.bg+"44",color:col.light}},col.icon),
          h("span",{className:"cat-label"},label)
        )),
        S.palettePos!=="bottom"&&h("div",{style:{flex:1}}),
        // trash zone
        S.palettePos!=="bottom"&&h("div",{
          onDragOver:e=>{e.preventDefault();setTrashHover(true);},
          onDragLeave:()=>setTrashHover(false),
          onDrop:e=>{
            e.preventDefault();setTrashHover(false);
            const bid=e.dataTransfer.getData("blockId");
            const isRoot=e.dataTransfer.getData("isRoot")==="1";
            if(!bid)return;
            const numId=parseInt(bid);
            if(isRoot)dispatch({t:"REM_ROOT",id:numId});
            else dispatch({t:"REM_CHILD",id:numId});
          },
          style:{width:52,height:52,borderRadius:12,background:trashHover?"#7f1d1d":"#1e1e38",border:`2px dashed ${trashHover?"#ef4444":"#ffffff15"}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"default",transition:"all 0.15s",marginBottom:12,gap:2}
        },
          h("span",{style:{fontSize:18}},trashHover?"💥":"🗑"),
          h("span",{style:{fontSize:8,color:trashHover?"#ef4444":"#3a3a5a",letterSpacing:"0.05em",fontFamily:"'Segoe UI',sans-serif"}},"DELETE")
        )
      ),

      // ── FLYOUT PANEL ──
      tab==="editor"&&(activeCat||search)&&h("div",{className:"flyout",style:
        S.palettePos==="right"
          ? {width:S.paletteWidth,order:2,borderLeft:"1px solid #ffffff10",boxShadow:"-4px 0 16px rgba(0,0,0,0.4)",overflowY:"auto"}
          : {width:S.paletteWidth,order:2,borderRight:"1px solid #ffffff10",boxShadow:"4px 0 16px rgba(0,0,0,0.4)",overflowY:"auto"}
      },
        search&&h("div",{style:{fontSize:10,color:"#6a6a9a",marginBottom:8,fontFamily:"'Segoe UI',sans-serif"}},`Results for "${search}"`),
        flyoutSections.map(sec=>h("div",{key:sec.label},
          !search&&h("div",{style:{fontSize:10,fontWeight:700,color:"#6a6a9a",letterSpacing:"0.08em",margin:"10px 0 6px",fontFamily:"'Segoe UI',sans-serif"}},sec.label),
          sec.keys.map(k=>h(PalBlock,{key:k,bname:k}))
        ))
      ),

      // ── CANVAS ──
      tab==="editor"&&h("div",{
        ref:canvasRef,
        onClick:()=>{setActiveCat(null);setCollab(c=>({...c,showPanel:false}));},
        onMouseDown:e=>{
          if(e.button===1){
            e.preventDefault();
            panRef.current.active=true;
            panRef.current.startX=e.clientX;
            panRef.current.startY=e.clientY;
            panRef.current.tx=pan.x;
            panRef.current.ty=pan.y;
            canvasRef.current.style.cursor='grabbing';
          }
        },

        onContextMenu:e=>{if(e.button===1)e.preventDefault();},
        onWheel:e=>{
          e.preventDefault();
          const rect=canvasRef.current.getBoundingClientRect();
          const mouseX=e.clientX-rect.left;
          const mouseY=e.clientY-rect.top;
          setZoom(z=>{
            const newZ=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,parseFloat((z+(e.deltaY<0?ZOOM_STEP:-ZOOM_STEP)).toFixed(2))));
            // Adjust pan so the point under cursor stays fixed
            // point in canvas space: (mouseX - pan.x) / z
            // after zoom: newPan + point * newZ = mouseX
            // newPan = mouseX - point * newZ = mouseX - (mouseX - pan.x) / z * newZ
            setPan(p=>({
              x: mouseX - (mouseX - p.x) * newZ / z,
              y: mouseY - (mouseY - p.y) * newZ / z,
            }));
            return newZ;
          });
        },

        onDragOver:e=>e.preventDefault(),
        onDrop:onCanvasDrop,
        onMouseMove:onCanvasMouseMove,
        onMouseUp:onCanvasMouseUp,
        onMouseLeave:e=>{
          if(panRef.current.active){panRef.current.active=false;if(canvasRef.current)canvasRef.current.style.cursor='';}
          onCanvasMouseUp(e);
        },
        className:"canvas-area",
        style:{flex:1,position:"relative",overflow:"hidden",
          touchAction:"none",
          order:S.palettePos==="right"?1:3,
          paddingBottom:S.palettePos==="bottom"?56:0,
          background:S.canvasBg,
          backgroundImage:`radial-gradient(rgba(255,255,255,0.07) 1.5px,transparent 1.5px)`,
          backgroundSize:`28px 28px`,
          backgroundPosition:`${pan.x%28}px ${pan.y%28}px`}
      },
        roots.length===0&&!activeCat&&h("div",{style:{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center",pointerEvents:"none",color:"#2a2a4e",zIndex:0}},
          h("div",{style:{fontSize:42,marginBottom:8}},"🧩"),
          h("div",{style:{fontSize:14,fontWeight:600,fontFamily:"'Segoe UI',sans-serif"}},
            "Origins Builder — drag to canvas • connect slots • Delete: remove hovered • Ctrl+C: copy • Ctrl+V: paste"),
          h("div",{style:{fontSize:11,marginTop:4,fontFamily:"'Segoe UI',sans-serif",color:"#1e1e3a"}},"drag root blocks to reposition · drag to 🗑 to delete")
        ),
        h("div",{style:{position:"absolute",top:0,left:0,width:"10000px",height:"10000px",transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`,transformOrigin:"0 0",overflow:"visible"}},
          (()=>{
            const peerDragColors={};
            Object.values(remoteDrags).forEach(d=>{if(d.id)peerDragColors[d.id]=d.color;});
            return roots.map(id=>{
              const b=bmap[id]; if(!b)return null;
              return h(ScratchBlock,{key:id,id,bmap,isChild:false,depth:0,dispatch,hoveredId,selectedId,setHoveredId,setSelectedId,mouseOverSlot,peerDragColor:peerDragColors[id]||null});
            });
          })(),
          // Remote cursors
          Object.entries(remoteCursors).map(([cid,cur])=>
            h("div",{key:"cur-"+cid,style:{position:"absolute",left:cur.x,top:cur.y,pointerEvents:"none",zIndex:9999,transform:"translate(-2px,-2px)"}},
              h("div",{style:{width:12,height:12,borderRadius:"50%",background:cur.color,
                boxShadow:`0 0 8px ${cur.color}`,border:"2px solid #fff"}}),
              h("div",{style:{position:"absolute",left:14,top:-2,background:cur.color,color:"#fff",
                fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,whiteSpace:"nowrap",
                fontFamily:"'Segoe UI',sans-serif"}},cur.nickname)
            )
          ),
        ), // end block layer
      ), // end canvas

      // ── JSON PANEL ──
      tab==="json"&&h("div",{style:{flex:1,overflowY:"auto",padding:24,background:"#0f0e1a"}},
        files.length===0
          ?h("div",{style:{color:"#2a2a4e",fontSize:13,fontFamily:"'Segoe UI',sans-serif"}},"// switch to editor and add some blocks first")
          :files.map((f,i)=>h("div",{key:i,style:{marginBottom:32}},
              h("div",{style:{fontSize:11,color:S.accent,marginBottom:8,letterSpacing:"0.06em",borderBottom:"1px solid #ffffff08",paddingBottom:6,fontFamily:"'Segoe UI',sans-serif",fontWeight:600}},"📄 "+f.name),
              h("pre",{style:{margin:0,fontSize:12,lineHeight:1.9,color:"#cdd6f4",background:"#0d0c1a",borderRadius:10,padding:"14px 18px",border:"1px solid #ffffff08",overflowX:"auto",fontFamily:"'Courier New',monospace"}},
                JSON.stringify(f.json,null,2))
          ))
      )
    ),

    // ── STATUS BAR ──
    h("div",{style:{height:28,background:"#0f0e1a",borderTop:"1px solid #ffffff08",display:"flex",alignItems:"center",padding:"0 16px",gap:16,flexShrink:0}},
      Object.entries(C).filter(([k])=>!k.includes('_meta')&&!['condition','action','power'].includes(k)).map(([k,c])=>{
        const label={meta:"Meta",bientity:"Bi-Entity",block:"Block",item:"Item",damage:"Damage",entity:"Entity",power_general:"General",power_action:"Power Action",power_modify:"Modify",power_prevent:"Prevent"}[k]||k;
        return h("span",{key:k,style:{fontSize:9,color:c.light,display:"flex",alignItems:"center",gap:4,fontFamily:"'Segoe UI',sans-serif"}},
          h("span",{style:{width:8,height:8,borderRadius:2,background:c.bg,display:"inline-block",border:`1px solid ${c.border}`}}),label);
      }),
      h("div",{style:{flex:1}}),
      h("span",{style:{fontSize:10,color:"#2a2a4e",fontFamily:"'Segoe UI',sans-serif"}},
        `${roots.length} root · ${Object.keys(bmap).length} blocks · ${files.length} output file${files.length!==1?"s":""}`)
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
