<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origins Builder</title>
  <meta name="description" content="Visual datapack creator for the Origins mod">
  <meta http-equiv="refresh" content="0; url=origins-manager.html">
  <style>
    body {
      margin: 0;
      background: #0a0a16;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Sora', sans-serif;
      color: #fff;
    }
    .logo {
      text-align: center;
    }
    .logo img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #7c5ce7, #00d2d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      font-size: 13px;
      color: #666;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="icon.png" alt="Origins Builder">
    <h1>Origins Builder</h1>
    <p>Loading...</p>
  </div>
  <script>
    window.location.replace('origins-manager.html');
  </script>
</body>
</html>
